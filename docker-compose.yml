services:
  plaid:
    build: .
    image: plaid:dev
    container_name: plaid
    restart: unless-stopped
    ports:
      - "32500:32500"
    volumes:
      # Server data (database, cache). A named volume keeps permissions right for the non-root user.
      - plaid-data:/data
      # Your media, read-only. Uncomment and point to your folders:
      # - /path/to/movies:/media/movies:ro
      # - /path/to/shows:/media/shows:ro
    # Hardware transcoding (optional, see docs/install.md).
    # Intel or AMD GPU (VAAPI, QSV): pass the GPU and the host's render group,
    # whose number you get with: getent group render | cut -d: -f3
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "993"
    # NVIDIA GPU (NVENC), with the NVIDIA Container Toolkit on the host:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu, video]
    # Transcode segments go to /data/transcodes (PLAID_TRANSCODE_DIR). To keep
    # them in memory instead of on disk:
    # tmpfs:
    #   - /data/transcodes:size=4g,uid=1000,gid=1000,mode=0750

volumes:
  plaid-data:
