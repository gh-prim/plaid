name: docker

# Called by ci.yml: on every push to main, and on PRs that touch Docker files.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build linux/amd64 + linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=0.1.0-dev
            COMMIT=${{ github.sha }}
          # Publishing to ghcr.io/gh-prim/plaid stays off until the license is decided (F001 spec, R18).
          push: false
          tags: ghcr.io/gh-prim/plaid:edge
          cache-from: type=gha
          cache-to: type=gha,mode=max
