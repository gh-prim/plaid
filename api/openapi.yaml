openapi: 3.1.0
info:
  title: PLAID API
  version: 0.1.0
  description: |
    API of the PLAID media server. This file is the source of truth:
    the Go server interfaces and every client are generated from it.
servers:
  - url: /api/v1
# Every operation needs a session unless it declares `security: []` (F003-R12).
# Native apps send a bearer token, the web app the plaid_session cookie.
security:
  - bearerAuth: []
  - cookieAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness and build info
      tags: [system]
      security: []
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Server is up but a dependency is failing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /server:
    get:
      operationId: getServerInfo
      summary: Identify a PLAID server
      tags: [system]
      security: []
      responses:
        "200":
          description: Server identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerInfo"
        default:
          $ref: "#/components/responses/Error"
  /setup:
    get:
      operationId: getSetup
      summary: First-run setup state
      tags: [setup]
      security: []
      responses:
        "200":
          description: Setup state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupState"
        default:
          $ref: "#/components/responses/Error"
  /setup/admin:
    post:
      operationId: createFirstAdmin
      summary: Create the first admin account and sign in
      description: |
        Only while no account exists (`409 setup_complete` after). Accepted from
        a private or loopback address, or with the setup code from the server log
        (`403 setup_code_required`). Web clients (`X-Plaid-Client: web`) get the
        session as a cookie, others get the token in the body.
      tags: [setup]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupAdminRequest"
      responses:
        "201":
          description: Admin created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        default:
          $ref: "#/components/responses/Error"
  /auth/login:
    post:
      operationId: login
      summary: Sign in with username and password
      description: |
        Errors never say whether the username exists (`401 invalid_credentials`).
        Repeated failures return `429 too_many_attempts` with `Retry-After`.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        default:
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      operationId: logout
      summary: End the current session
      tags: [auth]
      responses:
        "204":
          description: Signed out
        default:
          $ref: "#/components/responses/Error"
  /me:
    get:
      operationId: getMe
      summary: The signed-in account, its profiles and the active one
      tags: [me]
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateMe
      summary: Update own display name or locale
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Error"
  /me/password:
    post:
      operationId: changeMyPassword
      summary: Change own password
      description: Ends every other session of the account. The current one keeps working.
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed
        default:
          $ref: "#/components/responses/Error"
  /me/profiles:
    get:
      operationId: listMyProfiles
      summary: Profiles of the account
      tags: [profiles]
      responses:
        "200":
          description: Profiles, default first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Profile"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createMyProfile
      summary: Add a profile (8 at most)
      tags: [profiles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProfileRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        default:
          $ref: "#/components/responses/Error"
  /me/profiles/{profileId}:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    patch:
      operationId: updateMyProfile
      summary: Update a profile
      description: |
        Changing `pin`, `maxAge` or `allowUnrated` needs `currentPin` (when the
        profile has a PIN) or the account `password`.
      tags: [profiles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteMyProfile
      summary: Delete a profile (not the last one)
      tags: [profiles]
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"
  /session/profile:
    post:
      operationId: selectProfile
      summary: Set the active profile of the current session
      description: A PIN-protected profile needs its PIN every time. 5 wrong PINs lock it for 5 minutes on this session.
      tags: [profiles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectProfileRequest"
      responses:
        "200":
          description: Profile selected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Error"
  /me/sessions:
    get:
      operationId: listMySessions
      summary: Signed-in devices of the account
      tags: [sessions]
      responses:
        "200":
          description: Sessions, most recently seen first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionListItem"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: revokeMyOtherSessions
      summary: Sign out every other device
      tags: [sessions]
      responses:
        "204":
          description: Other sessions ended
        default:
          $ref: "#/components/responses/Error"
  /me/sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    delete:
      operationId: revokeMySession
      summary: Sign out one device
      tags: [sessions]
      responses:
        "204":
          description: Session ended
        default:
          $ref: "#/components/responses/Error"
  /users:
    get:
      operationId: listUsers
      summary: All accounts (admin)
      tags: [users]
      responses:
        "200":
          description: Accounts, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createUser
      summary: Create an account with a temporary password (admin)
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        default:
          $ref: "#/components/responses/Error"
  /users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    patch:
      operationId: updateUser
      summary: Update an account (admin)
      description: Demoting, disabling or deleting the last active admin returns `409 last_admin`. Disabling ends every session of the account.
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteUser
      summary: Delete an account, its profiles and sessions (admin)
      tags: [users]
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"
  /users/{userId}/password:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      operationId: resetUserPassword
      summary: Set a temporary password (admin)
      description: Ends every session of the account; the user must choose a new password at next sign-in.
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password reset
        default:
          $ref: "#/components/responses/Error"
  /users/{userId}/sessions:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      operationId: listUserSessions
      summary: Signed-in devices of an account (admin)
      tags: [users]
      responses:
        "200":
          description: Sessions, most recently seen first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionListItem"
        default:
          $ref: "#/components/responses/Error"
  /users/{userId}/sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/SessionId"
    delete:
      operationId: revokeUserSession
      summary: Sign out one device of an account (admin)
      tags: [users]
      responses:
        "204":
          description: Session ended
        default:
          $ref: "#/components/responses/Error"
  /pairing:
    post:
      operationId: startPairing
      summary: Get a code to pair a TV
      description: The TV shows `code` and polls `GET /pairing/{id}` with `pollSecret`. Expires after 10 minutes.
      tags: [pairing]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartPairingRequest"
      responses:
        "201":
          description: Pairing started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingStarted"
        default:
          $ref: "#/components/responses/Error"
  /pairing/{pairingId}:
    parameters:
      - name: pairingId
        in: path
        required: true
        schema:
          type: string
      - name: X-Pairing-Secret
        in: header
        required: true
        description: The `pollSecret` returned when the pairing started.
        schema:
          type: string
    get:
      operationId: pollPairing
      summary: Poll a pairing until it is claimed
      description: |
        Not authenticated by a session but by the poll secret. `202` while
        waiting; `200` with the session token exactly once after the claim;
        `404 pairing_not_found` after that or for a wrong secret.
      tags: [pairing]
      security: []
      responses:
        "200":
          description: Claimed; the TV is signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "202":
          description: Not claimed yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingPending"
        default:
          $ref: "#/components/responses/Error"
  /pairing/claim:
    post:
      operationId: claimPairing
      summary: Sign a TV in with the code it shows
      tags: [pairing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimPairingRequest"
      responses:
        "200":
          description: Claimed; the TV gets its session on its next poll
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        default:
          $ref: "#/components/responses/Error"
  /libraries:
    get:
      operationId: listLibraries
      summary: All libraries, with folder status, counts and scan state
      tags: [libraries]
      responses:
        "200":
          description: Libraries, by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Library"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createLibrary
      summary: Create a library and start its first scan (admin)
      description: |
        Each folder must be an absolute path to a directory PLAID can read and traverse
        (`422 folder_not_found`, `422 folder_unreadable`), and can't be inside or contain
        another library's folder (`409 folder_overlap`). Nothing is created on error.
      tags: [libraries]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLibraryRequest"
      responses:
        "201":
          description: Created; a full scan is queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Library"
        default:
          $ref: "#/components/responses/Error"
  /libraries/{libraryId}:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    get:
      operationId: getLibrary
      summary: One library
      tags: [libraries]
      responses:
        "200":
          description: The library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Library"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateLibrary
      summary: Rename a library, change its folders or scan interval (admin)
      description: |
        Absent fields are unchanged. `folders` replaces the whole list; added folders are
        validated like on creation and scanned. A `type` different from the current one
        returns `422 library_type_immutable`. `scanIntervalSeconds: null` goes back to the
        defaults (15 min unwatched, 6 h watched).
      tags: [libraries]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLibraryRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Library"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteLibrary
      summary: Delete a library's rows; files on disk are never touched (admin)
      tags: [libraries]
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"
  /libraries/{libraryId}/scan:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    get:
      operationId: getLibraryScan
      summary: Current scan progress (admin)
      tags: [libraries]
      responses:
        "200":
          description: Progress snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanProgress"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: scanLibrary
      summary: Scan now, or full rescan (admin)
      description: A request during a running scan queues one more scan; further requests are merged into it.
      tags: [libraries]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanRequest"
      responses:
        "202":
          description: Scan started or queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanProgress"
        default:
          $ref: "#/components/responses/Error"
  /libraries/{libraryId}/scan/events:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    get:
      operationId: getLibraryScanEvents
      summary: Live scan progress as server-sent events (admin)
      description: |
        `text/event-stream`. Events `progress`, `completed` and `failed`, each with a
        `ScanEvent` JSON in `data`. A progress event comes at least every 2 s while a scan
        runs, and a `: ping` comment every 15 s. The current state is sent first.
        `metadata` events carry the library's matching counters, at most every 2 s (F005 R35).
      tags: [libraries]
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /libraries/{libraryId}/items:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    get:
      operationId: listLibraryItems
      summary: Items of a library, by kind and parent
      description: >-
        Ordered by sort title unless `sort` says otherwise. Hidden items (no file left on disk) are left out. `sort`,
        `order`, `seed`, the filters, `offset` and `total` apply to top-level items only (no `parentId`, F008 R26);
        `offset` replaces `cursor` for random access. Every filter applies the age predicate (F005 R25) before
        counting.
      tags: [libraries]
      parameters:
        - name: sort
          in: query
          schema:
            $ref: "#/components/schemas/ItemSort"
        - name: order
          in: query
          description: Defaults to `asc` for `title`, `desc` otherwise. Ignored for `random`.
          schema:
            $ref: "#/components/schemas/SortOrder"
        - name: seed
          in: query
          description: Seed of the `random` order, so pages of one visit agree.
          schema:
            type: integer
            format: int64
        - name: watch
          in: query
          schema:
            $ref: "#/components/schemas/WatchFilter"
        - name: genre
          in: query
          description: TMDB genre ids; an item matches any of them.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: integer
        - name: yearFrom
          in: query
          schema:
            type: integer
        - name: yearTo
          in: query
          schema:
            type: integer
        - name: resolution
          in: query
          description: An item matches any of them, by its largest file.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ResolutionFilter"
        - name: hdr
          in: query
          description: Only items with an HDR file (true) or without one (false).
          schema:
            type: boolean
        - name: offset
          in: query
          description: Position of the first item, instead of `cursor`.
          schema:
            type: integer
            minimum: 0
        - name: total
          in: query
          description: Adds `total` to the page.
          schema:
            type: boolean
        - name: kind
          in: query
          description: Defaults to the top level, `movie` or `show`, when `parentId` is absent.
          schema:
            $ref: "#/components/schemas/ItemKind"
        - name: parentId
          in: query
          description: Seasons of a show, or episodes of a season.
          schema:
            type: string
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPage"
        default:
          $ref: "#/components/responses/Error"
  /libraries/{libraryId}/facets:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    get:
      operationId: getLibraryFacets
      summary: What a library's grid can be filtered by, with counts (F008 R27)
      description: Over the top-level items the active profile may see (F005 R25).
      tags: [catalog]
      responses:
        "200":
          description: The facets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryFacets"
        default:
          $ref: "#/components/responses/Error"
  /search:
    get:
      operationId: search
      summary: Movies, shows, episodes and people by word prefix, across the profile's libraries (F008 R28)
      tags: [catalog]
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: limit
          in: query
          description: Per group.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 8
      responses:
        "200":
          description: Results grouped by kind, best first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
        default:
          $ref: "#/components/responses/Error"
  /home:
    get:
      operationId: getHome
      summary: The home of the active profile, ambient item and rows (F008 R31)
      tags: [catalog]
      responses:
        "200":
          description: The home
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Home"
        default:
          $ref: "#/components/responses/Error"
  /home/rows/{rowId}:
    parameters:
      - name: rowId
        in: path
        required: true
        description: A HomeRow id, as returned by GET /home.
        schema:
          type: string
    get:
      operationId: getHomeRow
      summary: Next page of one home row (F008 R31)
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of the row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPage"
        default:
          $ref: "#/components/responses/Error"
  /items/{itemId}/up-next:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      operationId: getUpNext
      summary: The episode to play next for a show, a season or after an episode (F008 R32)
      tags: [catalog]
      responses:
        "200":
          description: The episode to play
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpNext"
        "204":
          description: Nothing to play next
        default:
          $ref: "#/components/responses/Error"
  /libraries/{libraryId}/unrecognized:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    get:
      operationId: listUnrecognizedFiles
      summary: Files whose name couldn't be understood (admin)
      tags: [libraries]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of files present on disk, by path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnrecognizedPage"
        default:
          $ref: "#/components/responses/Error"
  /libraries/{libraryId}/review:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    get:
      operationId: listLibraryReview
      summary: Items that need an admin's eye (F005 R5, R38)
      description: Movies and shows that need review, weren't found, or duplicate another item, with their candidates.
      tags: [metadata]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewPage"
        default:
          $ref: "#/components/responses/Error"
  /libraries/{libraryId}/metadata/refresh:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    post:
      operationId: refreshLibraryMetadata
      summary: Refresh a library's metadata now (F005 R31)
      tags: [metadata]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "202":
          description: Queued
        default:
          $ref: "#/components/responses/Error"
  /metadata/search:
    get:
      operationId: searchMetadata
      summary: Search TMDB for a match (admin, F005 R27)
      description: >-
        Free text, or an id: `tmdb:603`, `imdb:tt0133093`. With `itemId`, each candidate is scored against the item's
        parsed title and year.
      tags: [metadata]
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            type: string
            enum: [movie, show]
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: year
          in: query
          schema:
            type: integer
        - name: itemId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Candidates, best first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"
        default:
          $ref: "#/components/responses/Error"
  /metadata/candidate-images/{path}:
    parameters:
      - name: path
        in: path
        required: true
        description: A TMDB image file name from a candidate's posterPath, without the slash.
        schema:
          type: string
    get:
      operationId: getCandidateImage
      summary: A candidate's poster, through the server (admin, F005 R27)
      tags: [metadata]
      responses:
        "200":
          description: TMDB w185 image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /metadata/status:
    get:
      operationId: getMetadataStatus
      summary: Providers and per-library progress (admin, F005 R35)
      tags: [metadata]
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataStatus"
        default:
          $ref: "#/components/responses/Error"
  /metadata/settings:
    get:
      operationId: getMetadataSettings
      summary: Which provider keys are in use (admin, F005 R34)
      description: Keys are never returned.
      tags: [metadata]
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataSettings"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateMetadataSettings
      summary: Save or clear provider keys (admin, F005 R34)
      description: >-
        A key is checked against its provider before it's saved (`422 invalid_api_key` otherwise). `null` removes the
        saved key: the environment variable, then the key built into release binaries, apply again.
      tags: [metadata]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetadataSettingsPatch"
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataSettings"
        default:
          $ref: "#/components/responses/Error"
  /items/{itemId}/match:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      operationId: matchItem
      summary: Fix an item's match (admin, F005 R26, R39)
      description: >-
        A movie or show takes `tmdbId`; the match is locked against rescans and refreshes, and a show's seasons and
        episodes follow. An episode takes `seasonNumber` and `episodeNumber` to move its files to another episode of
        the same show.
      tags: [metadata]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchRequest"
      responses:
        "200":
          description: The item, matched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemDetail"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: unmatchItem
      summary: Forget a match; the item is matched again automatically (admin, F005 R26)
      tags: [metadata]
      responses:
        "204":
          description: Unmatched
        default:
          $ref: "#/components/responses/Error"
  /items/{itemId}/metadata:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    patch:
      operationId: updateItemMetadata
      summary: Edit and lock fields (admin, F005 R29)
      description: Each field set is locked against refreshes; `unlock` gives fields back to the provider.
      tags: [metadata]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetadataPatch"
      responses:
        "200":
          description: The item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemDetail"
        default:
          $ref: "#/components/responses/Error"
  /items/{itemId}/refresh:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    post:
      operationId: refreshItem
      summary: Refresh an item's metadata now (admin, F005 R31)
      tags: [metadata]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "202":
          description: Queued
        default:
          $ref: "#/components/responses/Error"
  /items/{itemId}/artwork:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      operationId: listItemArtwork
      summary: Artwork candidates (admin, F005 R30)
      tags: [metadata]
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/ArtworkKind"
      responses:
        "200":
          description: Candidates, selected first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtworkCandidates"
        default:
          $ref: "#/components/responses/Error"
  /items/{itemId}/artwork/{kind}:
    parameters:
      - $ref: "#/components/parameters/ItemId"
      - name: kind
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ArtworkKind"
    put:
      operationId: selectItemArtwork
      summary: Pick an image and lock the kind (admin, F005 R30)
      tags: [metadata]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtworkSelection"
      responses:
        "200":
          description: Candidates after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtworkCandidates"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: unlockItemArtwork
      summary: Back to the automatic choice (admin, F005 R30)
      tags: [metadata]
      responses:
        "204":
          description: Unlocked; the item is refreshed
        default:
          $ref: "#/components/responses/Error"
  /media-files/{fileId}/identify:
    parameters:
      - name: fileId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: identifyFile
      summary: Say what an unrecognized file is (admin, F005 R28)
      description: >-
        Movies libraries take `tmdbId`; shows libraries take `tmdbId` (the show), `seasonNumber` and
        `episodeNumbers`. The file keeps this identity through rescans and moves.
      tags: [metadata]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentifyRequest"
      responses:
        "200":
          description: The movie or episode the file now belongs to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemDetail"
        default:
          $ref: "#/components/responses/Error"
  /collections:
    get:
      operationId: listCollections
      summary: A library's collections (F005 R23)
      tags: [metadata]
      parameters:
        - name: libraryId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Collections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionList"
        default:
          $ref: "#/components/responses/Error"
  /collections/{collectionId}:
    parameters:
      - name: collectionId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getCollection
      summary: A collection with its movies, by release date (F005 R23)
      tags: [metadata]
      responses:
        "200":
          description: The collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionDetail"
        default:
          $ref: "#/components/responses/Error"
  /people/{personId}:
    parameters:
      - name: personId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getPerson
      summary: A person and what they're in, on this server (F005 R8)
      description: Only items the active profile may see (R25).
      tags: [metadata]
      responses:
        "200":
          description: The person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        default:
          $ref: "#/components/responses/Error"
  /items/{itemId}:
    parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getItem
      summary: An item with its files and streams
      tags: [libraries]
      responses:
        "200":
          description: The item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemDetail"
        default:
          $ref: "#/components/responses/Error"
  /items/{itemId}/preview:
    parameters:
      - $ref: "#/components/parameters/ItemId"
    get:
      operationId: getItemPreview
      summary: A short loop of scenes from the title, with their sound, for the hero (V2)
      description: >-
        Four scenes of six seconds from the movie's first third, or from a show's first episode, cut by FFmpeg and
        cached: H.264 MP4, 1280 wide, stereo AAC. The sound track is the one in `audio` when the file has it, else
        the one in the library's metadata language, else the file's default; one preview is cut per track. Every
        title is cut ahead of time (in the library's language), newest first, while nobody transcodes;
        a title not cut yet goes to the front of the queue and answers 202 with `Retry-After`; ask again until 200. A 404 means there's no preview (no FFmpeg, no file, too short, or the cut
        failed in the last hour) or the profile may not see the item. Supports `Range`. Served by a plain handler, not
        the generated server.
      tags: [preview]
      parameters:
        - $ref: "#/components/parameters/Range"
        - name: audio
          in: query
          description: >-
            The language to hear, as the profile last picked it in the player (ISO 639-1 or 639-2); ignored when
            the file has no track in it.
          schema:
            type: string
            examples: ["fre"]
      responses:
        "200":
          description: The preview
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "202":
          description: Being cut; ask again after `Retry-After` seconds
          headers:
            Retry-After:
              schema:
                type: integer
        "206":
          description: The requested range
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /images/{imageId}:
    parameters:
      - name: imageId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getImage
      summary: An artwork image, resized for the client (F005 R19)
      description: >-
        Served at the smallest width of 92, 185, 342, 500, 780, 1280, 1920 or 3840 that is at least `w`, never wider than
        the original. Photos are JPEG, logos and clearart PNG. Responses are immutable for an imageId: a new image gets a
        new id. An image of an item the active profile may not see is a 404 (R25).
      tags: [metadata]
      parameters:
        - name: w
          in: query
          description: Wanted width in pixels; defaults to 342.
          schema:
            type: integer
            minimum: 1
            maximum: 3840
        - name: If-None-Match
          in: header
          schema:
            type: string
      responses:
        "200":
          description: The image
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "304":
          description: Not modified (If-None-Match matched)
          headers:
            ETag:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /items/{itemId}/playback:
    parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
    post:
      operationId: startPlayback
      summary: Start playing a movie or an episode (F006 R1–R5)
      description: >-
        The client says what it wants and what it can play; the server picks Direct Play, Direct Stream or Transcode and
        says why. Needs an active profile. Items the profile may not see are a 404, like every item read (R9). `url` is
        relative to the server and carries its own token: players fetch it without any session (R25).
      tags: [playback]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaybackRequest"
      responses:
        "201":
          description: The playback session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackSession"
        default:
          $ref: "#/components/responses/Error"
  /items/{itemId}/watched:
    parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: markWatched
      summary: Mark an item watched for the active profile; a show or season marks every episode (F006 R35)
      tags: [playback]
      responses:
        "204":
          description: Marked
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: markUnwatched
      summary: Mark an item unwatched for the active profile; a show or season unmarks every episode (F006 R35)
      tags: [playback]
      responses:
        "204":
          description: Unmarked
        default:
          $ref: "#/components/responses/Error"
  /me/continue-watching:
    get:
      operationId: listContinueWatching
      summary: In-progress movies and episodes, plus each show's next episode, most recent first (F006 R37)
      tags: [playback]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of items, each with its userState
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPage"
        default:
          $ref: "#/components/responses/Error"
  /playback:
    get:
      operationId: listPlaybackSessions
      summary: Every active playback session (admin, F006 R29)
      tags: [playback]
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivePlaybackList"
        default:
          $ref: "#/components/responses/Error"
  /playback/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/PlaybackSessionId"
    get:
      operationId: getPlayback
      summary: One of your playback sessions
      tags: [playback]
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackSession"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updatePlayback
      summary: Change the audio track, subtitles, quality or bitrate of a session (F006 R6)
      description: >-
        The server decides again. An unchanged decision keeps the same `url`. A changed one gives the session a new
        token, so a new `url` (the old one answers 404 at once): the client reloads it from `positionMs`. A change that
        needs a transcode when none is free answers 503 `transcode_limit_reached`, and the session keeps its stream.
      tags: [playback]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaybackUpdate"
      responses:
        "200":
          description: The session, as decided again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackSession"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: stopPlayback
      summary: End a playback session (yours, or anyone's for an admin) and save its last position (F006 R8, R32)
      tags: [playback]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaybackStop"
      responses:
        "204":
          description: Ended
        default:
          $ref: "#/components/responses/Error"
  /playback/{sessionId}/progress:
    parameters:
      - $ref: "#/components/parameters/PlaybackSessionId"
    post:
      operationId: reportPlaybackProgress
      summary: Report the position and state; also keeps the session alive (F006 R32)
      description: Send it every 10 seconds while playing, and on every pause, seek and stop.
      tags: [playback]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaybackProgress"
      responses:
        "204":
          description: Recorded
        default:
          $ref: "#/components/responses/Error"
  /settings/playback:
    get:
      operationId: getPlaybackSettings
      summary: Playback settings (admin, F006 R30)
      tags: [playback]
      responses:
        "200":
          description: The settings in effect, defaults included
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackSettings"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updatePlaybackSettings
      summary: Change playback settings (admin, F006 R30)
      description: >-
        Absent fields keep their value; `null` on `maxTranscodes`, `transcodeDirMaxBytes` or `hwDevice` goes back to the
        default. Changing `hwAccel` or `hwDevice` runs the hardware test first (a few seconds): an explicit accelerator
        that fails it answers 422 `hw_accel_unavailable` and nothing is saved; `auto` falls back to software, and
        `hardware` says so (F006 R24).
      tags: [playback]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaybackSettingsUpdate"
      responses:
        "200":
          description: The settings in effect after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackSettings"
        default:
          $ref: "#/components/responses/Error"
  /stream/{token}/file:
    parameters:
      - $ref: "#/components/parameters/StreamToken"
    get:
      operationId: streamFile
      summary: The original file, for Direct Play (F006 R10)
      description: >-
        Authenticated by the token in the path only. Supports `Range` (one range), `If-Range` and `ETag`. An unknown or
        ended token is a 404 `playback_session_not_found`. Served by a plain handler, not the generated server.
      tags: [stream]
      security: []
      parameters:
        - $ref: "#/components/parameters/Range"
      responses:
        "200":
          description: The whole file
          headers:
            Accept-Ranges:
              schema:
                type: string
            ETag:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: The requested range
          headers:
            Content-Range:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "416":
          description: Range not satisfiable
        default:
          $ref: "#/components/responses/Error"
    head:
      operationId: headStreamFile
      summary: Headers of the original file (size, type, ranges)
      tags: [stream]
      security: []
      responses:
        "200":
          description: Headers only
        default:
          $ref: "#/components/responses/Error"
  /stream/{token}/master.m3u8:
    parameters:
      - $ref: "#/components/parameters/StreamToken"
    get:
      operationId: streamMasterPlaylist
      summary: HLS master playlist (F006 R11)
      description: >-
        One video variant with its audio, and the text subtitles as renditions. Relative URLs inherit the token. Sent with `Cache-Control: private, no-store`.
      tags: [stream]
      security: []
      responses:
        "200":
          description: OK
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /stream/{token}/video/index.m3u8:
    parameters:
      - $ref: "#/components/parameters/StreamToken"
    get:
      operationId: streamMediaPlaylist
      summary: HLS media playlist, every segment of the whole duration (VOD, F006 R11–R13)
      tags: [stream]
      security: []
      responses:
        "200":
          description: OK
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /stream/{token}/video/init.mp4:
    parameters:
      - $ref: "#/components/parameters/StreamToken"
    get:
      operationId: streamInitSegment
      summary: fMP4 init segment
      tags: [stream]
      security: []
      responses:
        "200":
          description: OK
          content:
            video/mp4:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /stream/{token}/video/{segment}.m4s:
    parameters:
      - $ref: "#/components/parameters/StreamToken"
      - $ref: "#/components/parameters/SegmentNumber"
    get:
      operationId: streamSegment
      summary: fMP4 media segment (F006 R14)
      description: >-
        Served as soon as it exists. A segment the current FFmpeg run reaches within 3 segments is waited for (up to 20 s, then 503 `segment_not_ready` with `Retry-After: 1`); any other one restarts FFmpeg there.
      tags: [stream]
      security: []
      responses:
        "200":
          description: OK
          content:
            video/mp4:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /stream/{token}/subtitles/{index}.m3u8:
    parameters:
      - $ref: "#/components/parameters/StreamToken"
      - $ref: "#/components/parameters/SubtitleIndex"
    get:
      operationId: streamSubtitlePlaylist
      summary: Subtitle rendition playlist, one WebVTT file for the whole duration (F006 R16)
      tags: [stream]
      security: []
      responses:
        "200":
          description: OK
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /stream/{token}/subtitles/{index}.vtt:
    parameters:
      - $ref: "#/components/parameters/StreamToken"
      - $ref: "#/components/parameters/SubtitleIndex"
    get:
      operationId: streamSubtitleVtt
      summary: A text subtitle track as WebVTT, converted once and cached (F006 R16)
      tags: [stream]
      security: []
      parameters:
        - $ref: "#/components/parameters/SubtitleFrom"
      responses:
        "200":
          description: OK
          headers:
            X-Subtitle-Until:
              $ref: "#/components/headers/SubtitleUntil"
          content:
            text/vtt:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /stream/{token}/subtitles/{index}.sup:
    parameters:
      - $ref: "#/components/parameters/StreamToken"
      - $ref: "#/components/parameters/SubtitleIndex"
    get:
      operationId: streamSubtitleSup
      summary: A PGS track as is, for clients that draw it themselves (`separate` capability, V2)
      tags: [stream]
      security: []
      parameters:
        - $ref: "#/components/parameters/SubtitleFrom"
      responses:
        "200":
          description: OK
          headers:
            X-Subtitle-Until:
              $ref: "#/components/headers/SubtitleUntil"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /stream/{token}/subtitles/{index}.ass:
    parameters:
      - $ref: "#/components/parameters/StreamToken"
      - $ref: "#/components/parameters/SubtitleIndex"
    get:
      operationId: streamSubtitleAss
      summary: An ASS/SSA track as is, for clients that render ASS (F006 R16)
      tags: [stream]
      security: []
      responses:
        "200":
          description: OK
          content:
            text/x-ssa:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /stream/{token}/artwork/{kind}:
    parameters:
      - $ref: "#/components/parameters/StreamToken"
      - name: kind
        in: path
        required: true
        schema:
          type: string
          enum: [poster, backdrop, still]
    get:
      operationId: streamArtwork
      summary: The playing item's artwork, through the playback token (F006 R40)
      description: >-
        For players that can't send a session (lock screen, "now playing", external players). An episode without its own
        image of that kind uses its season's, then its show's. Same widths and formats as `GET /images/{imageId}`. Only
        this item's artwork, and only while the session lives.
      tags: [stream]
      security: []
      parameters:
        - name: w
          in: query
          description: Wanted width in pixels; defaults to 342.
          schema:
            type: integer
            minimum: 1
            maximum: 3840
      responses:
        "200":
          description: The image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /fs/browse:
    get:
      operationId: browseFolders
      summary: Sub-folders of a server folder, for the folder picker (admin)
      description: |
        Lists directory names only, never files. `path` must be absolute without `..`;
        it defaults to `/`, or to the list of roots when `PLAID_BROWSE_ROOTS` is set,
        in which case paths outside the roots return `404 not_found`.
      tags: [libraries]
      parameters:
        - name: path
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Sub-folders, by name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowseResult"
        default:
          $ref: "#/components/responses/Error"
  /server/stats:
    get:
      operationId: getServerStats
      summary: What the machine is doing, for the admin dashboard (V2)
      description: >-
        Best effort: what the system doesn't expose (another OS, a container) is left out. Admins only.
      tags: [server]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerStats"
        default:
          $ref: "#/components/responses/Error"
  /server/capabilities:
    get:
      operationId: getServerCapabilities
      summary: ffprobe and file watching status (admin)
      tags: [libraries]
      responses:
        "200":
          description: Capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
        default:
          $ref: "#/components/responses/Error"
  /server/capabilities/hardware-test:
    post:
      operationId: testServerHardware
      summary: Run the hardware acceleration test again (admin, F007 R28)
      description: >-
        Re-runs the F006 R24 test with the current settings (a few seconds) and clears a fallback after repeated
        failures. 409 `hw_test_running` while a test runs.
      tags: [playback]
      responses:
        "200":
          description: The new test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HardwareStatus"
        default:
          $ref: "#/components/responses/Error"
  /problems:
    get:
      operationId: listProblems
      summary: What needs the admin's attention, last 7 days (admin, F007 R29)
      description: Newest first. Open problems, and resolved ones for 7 days after they were resolved.
      tags: [system]
      responses:
        "200":
          description: Problems
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemList"
        default:
          $ref: "#/components/responses/Error"
components:
  headers:
    SubtitleUntil:
      description: >-
        Present when the answer is only the part of the track around `from` (milliseconds): where that part ends.
        The whole track is being extracted meanwhile; ask again to get it.
      schema:
        type: integer
        format: int64
  parameters:
    SubtitleFrom:
      name: from
      in: query
      description: >-
        The playback position in milliseconds. When the whole track isn't extracted yet, the answer is the part around
        it (seconds instead of reading the whole file), with `X-Subtitle-Until`.
      schema:
        type: integer
        format: int64
        minimum: 0
    LibraryId:
      name: libraryId
      in: path
      required: true
      schema:
        type: string
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      description: Opaque `nextCursor` of the previous page.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    ProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: string
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
    PlaybackSessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    StreamToken:
      name: token
      in: path
      required: true
      description: The playback token from PlaybackSession.url. Never logged.
      schema:
        type: string
    SegmentNumber:
      name: segment
      in: path
      required: true
      description: Segment number, from 0, as listed in the media playlist.
      schema:
        type: integer
        minimum: 0
    SubtitleIndex:
      name: index
      in: path
      required: true
      description: The subtitle's stream index, as in PlaybackSession.subtitles.
      schema:
        type: integer
        minimum: 0
    Range:
      name: Range
      in: header
      schema:
        type: string
        examples: ["bytes=0-1048575"]
  responses:
    Error:
      description: Error. `error.code` is a stable key clients translate.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque session token returned by sign-in, setup or TV pairing.
    cookieAuth:
      type: apiKey
      in: cookie
      name: plaid_session
      description: "HttpOnly session cookie used by the web app. State-changing requests also need `X-Plaid-Client: web` and a same-origin `Origin`."
  schemas:
    Health:
      type: object
      required: [status, version, commit, uptimeSeconds, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
          examples: ["0.1.0-dev"]
        commit:
          type: string
          examples: ["02ec07a"]
        uptimeSeconds:
          type: integer
          format: int64
          minimum: 0
        database:
          type: string
          enum: [ok, error]
    ServerInfo:
      type: object
      required: [name, version, setupComplete]
      properties:
        name:
          type: string
          examples: ["living-room-nas"]
        version:
          type: string
        setupComplete:
          type: boolean
        attributions:
          type: array
          description: Notices of the metadata providers in use, to show on an About page (F005 R37).
          items:
            $ref: "#/components/schemas/Attribution"
    Attribution:
      type: object
      required: [provider, name, url, notice]
      properties:
        provider:
          type: string
          enum: [tmdb, fanart]
        name:
          type: string
        url:
          type: string
        notice:
          type: string
          description: English text; clients use the i18n key about.attribution.<provider>.
    SetupState:
      type: object
      required: [setupComplete, requiresSetupCode]
      properties:
        setupComplete:
          type: boolean
        requiresSetupCode:
          type: boolean
          description: True when this client isn't on a private network and must give the setup code from the server log.
    Role:
      type: string
      enum: [admin, member]
    DeviceType:
      type: string
      enum: [web, ios, ipados, tvos, android, androidtv, other]
    Device:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          examples: ["Firefox on macOS"]
        type:
          $ref: "#/components/schemas/DeviceType"
        clientVersion:
          type: string
          maxLength: 32
    SetupAdminRequest:
      type: object
      required: [displayName, username, password]
      properties:
        displayName:
          type: string
        username:
          type: string
        password:
          type: string
        locale:
          type: string
          examples: ["fr"]
        setupCode:
          type: string
        device:
          $ref: "#/components/schemas/Device"
    LoginRequest:
      type: object
      required: [username, password, device]
      properties:
        username:
          type: string
        password:
          type: string
        device:
          $ref: "#/components/schemas/Device"
    SessionInfo:
      type: object
      required: [id, deviceName, deviceType]
      properties:
        id:
          type: string
        deviceName:
          type: string
        deviceType:
          $ref: "#/components/schemas/DeviceType"
    AuthResult:
      type: object
      required: [expiresAt, session, user, profiles]
      properties:
        token:
          type: string
          description: "Session token for `Authorization: Bearer`. Absent for web clients, which get the `plaid_session` cookie instead."
        expiresAt:
          type: string
          format: date-time
        session:
          $ref: "#/components/schemas/SessionInfo"
        user:
          $ref: "#/components/schemas/User"
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/Profile"
        activeProfile:
          $ref: "#/components/schemas/Profile"
    User:
      type: object
      required: [id, username, displayName, role, locale, mustChangePassword]
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        locale:
          type: string
        mustChangePassword:
          type: boolean
    AdminUser:
      type: object
      required: [id, username, displayName, role, locale, mustChangePassword, disabled, createdAt]
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        locale:
          type: string
        mustChangePassword:
          type: boolean
        disabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
    Profile:
      type: object
      required: [id, name, avatarColor, hasPin, maxAge, allowUnrated, locale, isDefault]
      properties:
        id:
          type: string
        name:
          type: string
        avatarColor:
          type: integer
          minimum: 0
          maximum: 7
          description: Index of the `party-*` design token.
        hasPin:
          type: boolean
        maxAge:
          type: [integer, "null"]
          description: Age limit, one of 0, 7, 10, 12, 13, 16 or 18; null means no limit. Enforced by the browsing and playback features.
        allowUnrated:
          type: boolean
        locale:
          type: [string, "null"]
          description: Overrides the account locale; null uses the account's.
        isDefault:
          type: boolean
        ambient:
          $ref: "#/components/schemas/Artwork"
          description: The backdrop of what the profile watched last, which lights the profile picker (V2). Never for a profile with a PIN, so it doesn't show what it watches.
    Me:
      type: object
      required: [user, profiles]
      properties:
        user:
          $ref: "#/components/schemas/User"
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/Profile"
        activeProfile:
          $ref: "#/components/schemas/Profile"
    UpdateMeRequest:
      type: object
      properties:
        displayName:
          type: string
        locale:
          type: string
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
    CreateProfileRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        avatarColor:
          type: integer
        pin:
          type: string
          description: 4 digits.
        maxAge:
          type: integer
        allowUnrated:
          type: boolean
          description: Defaults to false when `maxAge` is set, true otherwise.
        locale:
          type: string
    UpdateProfileRequest:
      type: object
      description: Absent fields are unchanged; `null` clears `pin`, `maxAge` or `locale`.
      properties:
        name:
          type: string
        avatarColor:
          type: integer
        pin:
          type: [string, "null"]
        maxAge:
          type: [integer, "null"]
        allowUnrated:
          type: boolean
        locale:
          type: [string, "null"]
        isDefault:
          type: boolean
          description: Only `true` is meaningful; it moves the default flag to this profile.
        currentPin:
          type: string
          description: Proof for sensitive changes, when the profile has a PIN.
        password:
          type: string
          description: Account password, the other proof for sensitive changes.
    SelectProfileRequest:
      type: object
      required: [profileId]
      properties:
        profileId:
          type: string
        pin:
          type: string
    SessionListItem:
      type: object
      required: [id, deviceName, deviceType, createdAt, lastSeenAt, current]
      properties:
        id:
          type: string
        deviceName:
          type: string
        deviceType:
          $ref: "#/components/schemas/DeviceType"
        clientVersion:
          type: string
        lastIp:
          type: string
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        current:
          type: boolean
          description: True for the session making the request.
    CreateUserRequest:
      type: object
      required: [displayName, username, temporaryPassword, role]
      properties:
        displayName:
          type: string
        username:
          type: string
        temporaryPassword:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        locale:
          type: string
    UpdateUserRequest:
      type: object
      properties:
        displayName:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        locale:
          type: string
        disabled:
          type: boolean
    ResetPasswordRequest:
      type: object
      required: [temporaryPassword]
      properties:
        temporaryPassword:
          type: string
    StartPairingRequest:
      type: object
      required: [device]
      properties:
        device:
          $ref: "#/components/schemas/Device"
    PairingStarted:
      type: object
      required: [id, code, pollSecret, expiresAt]
      properties:
        id:
          type: string
        code:
          type: string
          description: Shown on the TV as `XXX-XXX`.
          examples: ["K7P-4QX"]
        pollSecret:
          type: string
        expiresAt:
          type: string
          format: date-time
    PairingPending:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending]
    ClaimPairingRequest:
      type: object
      required: [code, profileId]
      properties:
        code:
          type: string
          description: Case-insensitive, with or without the dash.
        profileId:
          type: string
          description: Profile the TV starts on.
        pin:
          type: string
          description: Needed when that profile has a PIN.
    LibraryType:
      type: string
      enum: [movies, shows]
    LibraryFolder:
      type: object
      required: [id, path, watched, status]
      properties:
        id:
          type: string
        path:
          type: string
          description: Cleaned, with symlinks resolved.
          examples: ["/srv/media/movies"]
        fsType:
          type: string
          examples: ["ext4", "nfs"]
        watched:
          type: boolean
          description: Changes are picked up live; false on network file systems or when the watch limit was reached.
        status:
          type: string
          enum: [ok, unavailable, unreadable]
    LibraryCounts:
      type: object
      required: [movies, shows, episodes, files, unrecognized]
      properties:
        movies:
          type: integer
        shows:
          type: integer
        episodes:
          type: integer
        files:
          type: integer
          description: Files present on disk.
        unrecognized:
          type: integer
    Library:
      type: object
      required: [id, name, type, scanIntervalSeconds, metadataLanguage, metadataRegion, folders, counts, scan]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          $ref: "#/components/schemas/LibraryType"
        scanIntervalSeconds:
          type: [integer, "null"]
          description: Null when the defaults apply (15 min unwatched, 6 h watched).
        metadataLanguage:
          $ref: "#/components/schemas/MetadataLanguage"
        metadataRegion:
          $ref: "#/components/schemas/MetadataRegion"
        lastScanAt:
          type: string
          format: date-time
        folders:
          type: array
          items:
            $ref: "#/components/schemas/LibraryFolder"
        counts:
          $ref: "#/components/schemas/LibraryCounts"
        scan:
          $ref: "#/components/schemas/ScanProgress"
    CreateLibraryRequest:
      type: object
      required: [name, type, folders]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        type:
          $ref: "#/components/schemas/LibraryType"
        folders:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: string
          examples: [["/srv/media/movies"]]
        scanIntervalSeconds:
          type: integer
          minimum: 300
          maximum: 86400
    UpdateLibraryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        type:
          $ref: "#/components/schemas/LibraryType"
        folders:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: string
        scanIntervalSeconds:
          type: [integer, "null"]
          minimum: 300
          maximum: 86400
        metadataLanguage:
          $ref: "#/components/schemas/MetadataLanguage"
        metadataRegion:
          $ref: "#/components/schemas/MetadataRegion"
    MetadataLanguage:
      type: string
      pattern: "^[a-z]{2}$"
      description: >-
        ISO 639-1 language metadata is fetched in, English filling the gaps (F005 R10, R11). Defaults to the
        creating admin's locale. Changing it refreshes the library's metadata in the background.
      examples: [fr]
    MetadataRegion:
      type: string
      pattern: "^[A-Z]{2}$"
      description: ISO 3166-1 alpha-2 region for certifications and release dates (F005 R10, R24).
      examples: [FR]
    ScanRequest:
      type: object
      properties:
        full:
          type: boolean
          default: false
          description: Re-probe every file, changed or not.
    ScanState:
      type: string
      enum: [idle, queued, scanning, analyzing]
    ScanCounters:
      type: object
      required: [found, new, changed, moved, missing, analyzed, failed, unrecognized]
      properties:
        found:
          type: integer
        new:
          type: integer
        changed:
          type: integer
        moved:
          type: integer
        missing:
          type: integer
        analyzed:
          type: integer
        failed:
          type: integer
        unrecognized:
          type: integer
    ScanProgress:
      type: object
      required: [state, queued, full, counters]
      properties:
        state:
          $ref: "#/components/schemas/ScanState"
        queued:
          type: boolean
          description: Another scan starts when this one ends.
        full:
          type: boolean
        currentFolder:
          type: string
        startedAt:
          type: string
          format: date-time
        counters:
          $ref: "#/components/schemas/ScanCounters"
          description: Of the running scan, or of the last one when idle.
    ScanEvent:
      type: object
      description: The `data` of a scan server-sent event.
      required: [type]
      properties:
        type:
          type: string
          enum: [progress, completed, failed, metadata, matched]
        progress:
          $ref: "#/components/schemas/ScanProgress"
        metadata:
          $ref: "#/components/schemas/MetadataCounts"
        item:
          $ref: "#/components/schemas/MatchedItem"
        error:
          type: string
          description: Set on `failed`, English, for logs.
    MatchedItem:
      type: object
      description: >-
        Set on `matched`: a movie or show of this library just matched (F007 R27). Sent as it happens, for live views;
        a slow client may miss some, the `metadata` counters stay exact.
      required: [id, kind, title]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [movie, show]
        title:
          type: string
          description: In the library's metadata language.
        year:
          type: integer
        poster:
          $ref: "#/components/schemas/Artwork"
        backdrop:
          $ref: "#/components/schemas/Artwork"
    ItemKind:
      type: string
      enum: [movie, show, season, episode]
    ItemHints:
      type: object
      description: Ids found in file names, for metadata matching (F005).
      properties:
        tmdb:
          type: string
        imdb:
          type: string
    Resolution:
      type: object
      required: [width, height]
      properties:
        width:
          type: integer
        height:
          type: integer
    TechnicalSummary:
      type: object
      description: Across the item's files present on disk (for shows and seasons, their episodes).
      required: [hdrFormats, audioLanguages]
      properties:
        resolution:
          $ref: "#/components/schemas/Resolution"
          description: The largest one.
        hdrFormats:
          type: array
          items:
            type: string
            enum: [hdr10, hdr10plus, dolby_vision, hlg]
        audioLanguages:
          type: array
          description: ISO 639-2/B codes; clients show names with `Intl.DisplayNames`.
          items:
            type: string
          examples: [["eng", "fre"]]
    ItemSummary:
      type: object
      required: [id, kind, displayTitle, matchStatus, genres, fileCount, childCount, technical]
      properties:
        id:
          type: string
        kind:
          $ref: "#/components/schemas/ItemKind"
        libraryId:
          type: string
          description: The library holding the item (F008 R17, R21).
        parentId:
          type: string
        title:
          type: string
          description: Parsed from names. See displayTitle for what to show.
        displayTitle:
          type: string
          description: The matched (or .nfo) title, else the parsed one. Empty for a season or episode TMDB doesn't know.
        matchStatus:
          $ref: "#/components/schemas/MatchStatus"
        releaseDate:
          type: string
          format: date
          description: Movie release, show first air date, season or episode air date.
        rating:
          type: number
          description: TMDB average vote, 0–10.
        certification:
          type: string
          description: Content rating in certificationRegion, e.g. PG-13 or FSK 16.
        ageRating:
          type: integer
          description: Minimum age derived from the certification (0, 7, 10, 12, 13, 16, 18); absent when unrated.
        genres:
          type: array
          items:
            type: string
        poster:
          $ref: "#/components/schemas/Artwork"
        backdrop:
          $ref: "#/components/schemas/Artwork"
        still:
          $ref: "#/components/schemas/Artwork"
        year:
          type: integer
        seasonNumber:
          type: integer
        episodeNumber:
          type: integer
        airDate:
          type: string
          format: date
        hints:
          $ref: "#/components/schemas/ItemHints"
        fileCount:
          type: integer
        childCount:
          type: integer
          description: Seasons of a show, episodes of a season; 0 otherwise.
        technical:
          $ref: "#/components/schemas/TechnicalSummary"
        userState:
          $ref: "#/components/schemas/UserState"
        addedAt:
          type: string
          format: date-time
          description: When the item was added; for a show, when its newest episode was (F008 R26).
        runtimeMinutes:
          type: integer
          description: TMDB runtime (F008 R21 episode rows, R7 cards).
        overview:
          type: string
          description: Seasons and episodes only, for episode lists (F008 R21); other kinds have it in ItemDetail.metadata.
        show:
          $ref: "#/components/schemas/ShowRef"
    ShowRef:
      type: object
      description: The show of a season or an episode (F008 R30).
      required: [id, displayTitle]
      properties:
        id:
          type: string
        displayTitle:
          type: string
        logo:
          $ref: "#/components/schemas/Artwork"
    ItemPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemSummary"
        nextCursor:
          type: string
          description: Absent on the last page.
        total:
          type: integer
          description: Every item matching the query, when `total=true` (F008 R26).
    ItemSort:
      type: string
      enum: [title, added, released, rating, played, random]
    SortOrder:
      type: string
      enum: [asc, desc]
    WatchFilter:
      type: string
      enum: [unwatched, in_progress, watched]
    ResolutionFilter:
      type: string
      enum: [2160p, 1080p, 720p, sd]
      description: sd is anything under 720p.
    LibraryFacets:
      type: object
      required: [total, genres, decades, resolutions, hdr, letters]
      properties:
        total:
          type: integer
          description: Top-level items the profile may see.
        genres:
          type: array
          description: By count, most first.
          items:
            $ref: "#/components/schemas/GenreFacet"
        decades:
          type: array
          items:
            $ref: "#/components/schemas/DecadeFacet"
        resolutions:
          type: array
          items:
            $ref: "#/components/schemas/ResolutionFacet"
        hdr:
          type: integer
          description: Items with an HDR file.
        letters:
          type: array
          description: In title sort order; digits and symbols are grouped as "#".
          items:
            $ref: "#/components/schemas/LetterFacet"
    GenreRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          description: TMDB genre id.
        name:
