          type: integer
        title:
          type: string
        originalTitle:
          type: string
        year:
          type: integer
        overview:
          type: string
        posterPath:
          type: string
          description: For GET /metadata/candidate-images/{path} (without the leading slash).
        confidence:
          type: number
          description: Score against the item (R4), 0–1.
    SearchResult:
      type: object
      required: [candidates]
      properties:
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/MatchCandidate"
    ReviewItem:
      type: object
      required: [item, reason, candidates]
      properties:
        item:
          $ref: "#/components/schemas/ItemSummary"
        reason:
          type: string
          enum: [needs_review, unmatched, duplicate]
        duplicateOf:
          type: string
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/MatchCandidate"
    ReviewPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReviewItem"
        nextCursor:
          type: string
    MatchRequest:
      type: object
      properties:
        tmdbId:
          type: integer
          minimum: 1
        seasonNumber:
          type: integer
          minimum: 0
        episodeNumber:
          type: integer
          minimum: 0
    MetadataPatch:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        sortTitle:
          type: string
          minLength: 1
          maxLength: 300
        originalTitle:
          type: string
          maxLength: 300
        overview:
          type: string
          maxLength: 10000
        tagline:
          type: string
          maxLength: 500
        releaseDate:
          type: string
          format: date
        genres:
          type: array
          maxItems: 20
          items:
            type: string
        certification:
          type: string
          maxLength: 20
        unlock:
          type: array
          items:
            type: string
          description: Fields to give back to the provider.
    ArtworkKind:
      type: string
      enum: [poster, backdrop, logo, clearart, banner, thumb, still]
    ArtworkCandidate:
      type: object
      required: [id, kind, source, selected, locked]
      properties:
        id:
          type: string
        kind:
          $ref: "#/components/schemas/ArtworkKind"
        source:
          type: string
          enum: [local, tmdb, fanart]
        language:
          type: string
        width:
          type: integer
        height:
          type: integer
        votes:
          type: number
        selected:
          type: boolean
        locked:
          type: boolean
    ArtworkCandidates:
      type: object
      required: [candidates]
      properties:
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/ArtworkCandidate"
    ArtworkSelection:
      type: object
      required: [candidateId]
      properties:
        candidateId:
          type: string
    IdentifyRequest:
      type: object
      required: [tmdbId]
      properties:
        tmdbId:
          type: integer
          minimum: 1
          description: The movie, or the show for an episode.
        seasonNumber:
          type: integer
          minimum: 0
        episodeNumbers:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: integer
            minimum: 0
    ProviderStatus:
      type: object
      required: [provider, state, keySource]
      properties:
        provider:
          type: string
          enum: [tmdb, fanart]
        state:
          type: string
          enum: [ok, unreachable, invalid_key, no_api_key, disabled]
        keySource:
          type: string
          enum: [custom, env, builtin, none]
        lastError:
          type: string
        lastErrorAt:
          type: string
          format: date-time
    MetadataStatus:
      type: object
      required: [providers, libraries]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/ProviderStatus"
        libraries:
          type: array
          items:
            $ref: "#/components/schemas/LibraryMetadataCounts"
    LibraryMetadataCounts:
      type: object
      required: [libraryId, pending, matched, needsReview, unmatched]
      properties:
        libraryId:
          type: string
        pending:
          type: integer
        matched:
          type: integer
        needsReview:
          type: integer
        unmatched:
          type: integer
        refreshing:
          type: integer
          description: Titles already looked up whose scheduled refresh is due, being fetched again (artwork, credits).
    MetadataSettings:
      type: object
      required: [tmdb, fanart]
      properties:
        tmdb:
          type: object
          required: [keySource]
          properties:
            keySource:
              type: string
              enum: [custom, env, builtin, none]
        fanart:
          type: object
          required: [keySource, personalKeySet]
          properties:
            keySource:
              type: string
              enum: [custom, env, builtin, none]
            personalKeySet:
              type: boolean
    MetadataSettingsPatch:
      type: object
      properties:
        tmdbApiKey:
          type: [string, "null"]
          maxLength: 200
        fanartApiKey:
          type: [string, "null"]
          maxLength: 200
        fanartPersonalKey:
          type: [string, "null"]
          maxLength: 200
    CollectionSummary:
      type: object
      required: [id, name, movieCount]
      properties:
        id:
          type: string
        name:
          type: string
        overview:
          type: string
        poster:
          $ref: "#/components/schemas/Artwork"
        backdrop:
          $ref: "#/components/schemas/Artwork"
        movieCount:
          type: integer
          description: Movies of the collection the profile may see.
    CollectionList:
      type: object
      required: [collections]
      properties:
        collections:
          type: array
          items:
            $ref: "#/components/schemas/CollectionSummary"
    CollectionDetail:
      allOf:
        - $ref: "#/components/schemas/CollectionSummary"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ItemSummary"
    PersonCredit:
      type: object
      required: [item, role]
      properties:
        item:
          $ref: "#/components/schemas/ItemSummary"
        role:
          type: string
          enum: [cast, director, writer, creator]
        character:
          type: string
    Person:
      type: object
      required: [id, name, credits]
      properties:
        id:
          type: string
        name:
          type: string
        portrait:
          $ref: "#/components/schemas/Artwork"
        credits:
          type: array
          items:
            $ref: "#/components/schemas/PersonCredit"
    MatchStatus:
      type: string
      enum: [pending, matched, needs_review, unmatched]
      description: >-
        pending: not matched yet (or no TMDB key). needs_review: candidates are waiting for an admin. unmatched:
        TMDB found nothing; it's tried again later (F005 R5).
    ItemMetadata:
      type: object
      description: What F005 knows about an item, beyond the summary (R7, R8, R22, R23).
      required: [fieldLanguages, lockedFields, localFields, studios, trailers, credits, providerIds, backdrops, genres]
      properties:
        genres:
          type: array
          description: With their TMDB ids, for links to the library filtered by genre (F008 R17); 0 for a genre an admin typed.
          items:
            $ref: "#/components/schemas/GenreRef"
        matchSource:
          type: string
          enum: [nfo, hint, auto, manual, parent]
        confidence:
          type: number
        originalTitle:
          type: string
        overview:
          type: string
        tagline:
          type: string
        endDate:
          type: string
          format: date
          description: A show's last air date.
        showStatus:
          type: string
          enum: [returning, ended, canceled, in_production]
        runtimeMinutes:
          type: integer
        ratingCount:
          type: integer
        certificationRegion:
          type: string
        studios:
          type: array
          description: Studios, or networks for a show.
          items:
            type: string
        trailers:
          type: array
          items:
            $ref: "#/components/schemas/Trailer"
        collection:
          $ref: "#/components/schemas/CollectionRef"
        credits:
          type: array
          items:
            $ref: "#/components/schemas/Credit"
        fieldLanguages:
          type: object
          description: 'Language of text fields that fell back to English, e.g. {"overview": "en"} (R11).'
          additionalProperties:
            type: string
        lockedFields:
          type: array
          description: Fields an admin set; refreshes don't change them (R29).
          items:
            type: string
        localFields:
          type: array
          description: Fields taken from a local .nfo (R12).
          items:
            type: string
        providerIds:
          $ref: "#/components/schemas/ProviderIds"
        logo:
          $ref: "#/components/schemas/Artwork"
        clearart:
          $ref: "#/components/schemas/Artwork"
        backdrops:
          type: array
          description: Up to 3 backdrops, best first (R15).
          items:
            $ref: "#/components/schemas/Artwork"
        duplicateOf:
          type: string
          description: The older item of the library matched to the same title (R38).
    Trailer:
      type: object
      required: [site, key, language, type, official]
      properties:
        site:
          type: string
          enum: [YouTube]
        key:
          type: string
          description: The video id; clients build the URL. The server never calls YouTube.
        name:
          type: string
        language:
          type: string
        type:
          type: string
          enum: [Trailer, Teaser]
        official:
          type: boolean
    CollectionRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    Credit:
      type: object
      required: [personId, name, role]
      properties:
        personId:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [cast, director, writer, creator]
        character:
          type: string
        portrait:
          $ref: "#/components/schemas/Artwork"
    Artwork:
      type: object
      description: An image; fetch it with GET /images/{imageId}?w=.
      required: [imageId]
      properties:
        imageId:
          type: string
        width:
          type: integer
          description: Original width, when known.
        height:
          type: integer
        source:
          type: string
          enum: [local, tmdb, fanart]
        colors:
          $ref: "#/components/schemas/AmbientColors"
    AmbientColors:
      type: object
      description: Colors taken from the image for the UI (R21), as #rrggbb.
      required: [dominant, vibrant, muted, dark, onDominant]
      properties:
        dominant:
          type: string
        vibrant:
          type: string
        muted:
          type: string
        dark:
          type: string
        onDominant:
          type: string
          enum: [light, dark]
          description: Text color that reads on the dominant color.
    ProviderIds:
      type: object
      properties:
        tmdb:
          type: integer
        imdb:
          type: string
        tvdb:
          type: integer
    UnrecognizedFile:
      type: object
      required: [id, path, size, probeStatus]
      properties:
        id:
          type: string
        path:
          type: string
        size:
          type: integer
          format: int64
        probeStatus:
          type: string
          enum: [pending, ok, failed, skipped]
    UnrecognizedPage:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/UnrecognizedFile"
        nextCursor:
          type: string
    BrowseEntry:
      type: object
      required: [name, path, readable]
      properties:
        name:
          type: string
        path:
          type: string
        readable:
          type: boolean
          description: PLAID can list and enter this folder.
    BrowseResult:
      type: object
      required: [path, parent, entries]
      properties:
        path:
          type: string
          description: Empty when listing the configured roots.
        parent:
          type: [string, "null"]
          description: Null at `/`, at a configured root, or when listing the roots.
        entries:
          type: array
          items:
            $ref: "#/components/schemas/BrowseEntry"
    UserState:
      type: object
      description: The active profile's watch state for an item (F006 R36). Absent when no profile is active.
      required: [positionMs, watched, playCount]
      properties:
        positionMs:
          type: integer
          format: int64
          description: Resume point, 0 when there's none.
        durationMs:
          type: integer
          format: int64
          description: Length of the file last played, when known, for the time left (F008 R7).
        watched:
          type: boolean
        playCount:
          type: integer
        lastPlayedAt:
          type: string
          format: date-time
        watchedEpisodes:
          type: integer
          description: Shows and seasons only.
        totalEpisodes:
          type: integer
          description: Shows and seasons only.
    VideoCapability:
      type: object
      required: [codec]
      properties:
        codec:
          type: string
          description: ffprobe codec name, e.g. h264, hevc, av1, vp9.
        profiles:
          type: array
          description: Accepted ffprobe profile names, lowercase (`high`, `main 10`); absent means any.
          items:
            type: string
        maxLevel:
          type: integer
          description: Highest level, as ffprobe reports it (H.264 51 = 5.1, HEVC 153 = 5.1).
        maxWidth:
          type: integer
        maxHeight:
          type: integer
        maxBitDepth:
          type: integer
          default: 8
        hdr:
          type: array
          description: HDR formats shown as HDR; anything else needs tone mapping.
          items:
            type: string
            enum: [hdr10, hdr10plus, hlg, dolby_vision]
    AudioCapability:
      type: object
      required: [codec]
      properties:
        codec:
          type: string
          description: ffprobe codec name, e.g. aac, ac3, eac3, opus, flac, truehd, dts.
        maxChannels:
          type: integer
          default: 2
    SubtitleCapability:
      type: object
      properties:
        text:
          type: array
          description: Text formats the client renders itself.
          items:
            type: string
            enum: [vtt, srt, ass]
        image:
          type: array
          description: Image formats the client renders itself, from the file it plays.
          items:
            type: string
            enum: [pgs, vobsub]
        separate:
          type: array
          description: >-
            Image formats the client draws itself from a stream of their own (a web player's canvas): fetched from the
            subtitle's `url` as is (.sup), never burned in.
          items:
            type: string
            enum: [pgs]
    CapabilityProfile:
      type: object
      description: >-
        What the client can play (F006 R2). Sent with each playback request, never stored. `preset: external` means
        "plays everything over HTTP" (VLC, mpv) and ignores the other fields. Unknown codec names are ignored.
      properties:
        preset:
          type: string
          enum: [external]
        protocols:
          type: array
          items:
            type: string
            enum: [http, hls]
        containers:
          type: array
          description: Containers for Direct Play, as short names (mp4, mkv, webm, mov, ts, avi).
          items:
            type: string
        video:
          type: array
          items:
            $ref: "#/components/schemas/VideoCapability"
        audio:
          type: array
          items:
            $ref: "#/components/schemas/AudioCapability"
        subtitles:
          $ref: "#/components/schemas/SubtitleCapability"
        canSwitchAudioTrack:
          type: boolean
          default: false
          description: The player can pick a non-default audio track inside a file.
        maxBitrate:
          type: [integer, "null"]
          format: int64
          description: Bits per second; null for no limit.
    Quality:
      type: string
      enum: [original, 2160p, 1080p, 720p, 480p, 360p]
    PlaybackRequest:
      type: object
      required: [profile]
      properties:
        profile:
          $ref: "#/components/schemas/CapabilityProfile"
        fileId:
          type: string
          description: Defaults to the best file of the item for this client (R3).
        audioStreamIndex:
          type: integer
          description: Defaults to the file's default audio track.
        subtitleStreamIndex:
          type: [integer, "null"]
          description: null turns subtitles off; absent picks a forced track in the audio language, if any.
        startPositionMs:
          type: integer
          format: int64
          minimum: 0
          default: 0
        maxBitrate:
          type: integer
          format: int64
          minimum: 1
        quality:
          $ref: "#/components/schemas/Quality"
        burnSubtitles:
          type: boolean
          default: false
        forceMethod:
          type: string
          enum: [direct_stream, transcode]
          description: For debugging.
    PlaybackMethod:
      type: string
      enum: [direct_play, direct_stream, transcode]
    PlaybackAudioTrack:
      type: object
      required: [index, codec, channels, language, default, selected]
      properties:
        index:
          type: integer
        codec:
          type: string
        channels:
          type: integer
        language:
          type: string
        title:
          type: string
        default:
          type: boolean
        selected:
          type: boolean
        delivered:
          type: string
          description: The codec the client receives for the selected track, when it's converted (e.g. aac).
    PlaybackSubtitle:
      type: object
      required: [index, codec, language, forced, selected, delivery]
      properties:
        index:
          type: integer
        codec:
          type: string
        language:
          type: string
        title:
          type: string
        forced:
          type: boolean
        selected:
          type: boolean
        delivery:
          type: string
          enum: [embedded, external, burn_in]
          description: >-
            How the track reaches the client when selected: embedded = read by the player from the file it plays (Direct
            Play only); external = fetched separately from `url`, as WebVTT for a text track or as is (.sup) for a PGS
            track the client draws (`separate` capability); burn_in = drawn into the video.
        url:
          type: string
    PlaybackSession:
      type: object
      required: [id, itemId, fileId, method, reasons, url, expiresAfterIdleSeconds, durationMs, startPositionMs, quality, qualities, warnings, audioTracks, subtitles]
      properties:
        id:
          type: string
        itemId:
          type: string
        fileId:
          type: string
        method:
          $ref: "#/components/schemas/PlaybackMethod"
        reasons:
          type: array
          description: >-
            Why the method isn't Direct Play, as stable keys: container_not_supported, video_codec_not_supported,
            video_profile_not_supported, resolution_too_high, bit_depth_not_supported, hdr_not_supported,
            audio_codec_not_supported, audio_channels_too_many, audio_track_switch_unsupported, subtitle_burn_in,
            bitrate_too_high, keyframe_index_missing, forced_by_client.
          items:
            type: string
        url:
          type: string
          description: Relative to the server, e.g. /api/v1/stream/<token>/file.
        expiresAfterIdleSeconds:
          type: integer
        durationMs:
          type: integer
          format: int64
        startPositionMs:
          type: integer
          format: int64
        quality:
          $ref: "#/components/schemas/Quality"
        qualities:
          type: array
          items:
            $ref: "#/components/schemas/Quality"
        hardwareAcceleration:
          type: string
          enum: [vaapi, qsv, nvenc, v4l2m2m, videotoolbox]
          description: >-
            The accelerator a transcode runs on, absent in software or without transcoding. It disappears when a
            hardware run fails and the session continues in software (F006 R24).
        warnings:
          type: array
          description: Stable keys, e.g. colors_may_be_wrong.
          items:
            type: string
        audioTracks:
          type: array
          items:
            $ref: "#/components/schemas/PlaybackAudioTrack"
        subtitles:
          type: array
          items:
            $ref: "#/components/schemas/PlaybackSubtitle"
    PlaybackState:
      type: string
      enum: [playing, paused, buffering, stopped]
    PlaybackProgress:
      type: object
      required: [positionMs, state]
      properties:
        positionMs:
          type: integer
          format: int64
          minimum: 0
        state:
          $ref: "#/components/schemas/PlaybackState"
    PlaybackStop:
      type: object
      properties:
        positionMs:
          type: integer
          format: int64
          minimum: 0
    PlaybackUpdate:
      type: object
      required: [positionMs]
      properties:
        positionMs:
          type: integer
          format: int64
          minimum: 0
          description: Where the client is; a new `url` starts there.
        audioStreamIndex:
          type: integer
        subtitleStreamIndex:
          type: [integer, "null"]
          description: null turns subtitles off; absent keeps the current choice.
        quality:
          $ref: "#/components/schemas/Quality"
        maxBitrate:
          type: [integer, "null"]
          format: int64
          minimum: 1
          description: null removes the request's limit.
        burnSubtitles:
          type: boolean
    EncoderPreset:
      type: string
      enum: [fast, balanced, quality]
      x-enum-varnames: [EncoderPresetFast, EncoderPresetBalanced, EncoderPresetQuality]
      description: >-
        Encoder speed against quality (libx264 veryfast, faster, medium). On 4 cores or fewer (counting a container's
        CPU quota), fast uses superfast to keep up with real time.
    HwAccelSetting:
      type: string
      enum: [auto, none, vaapi, qsv, nvenc, v4l2m2m, videotoolbox]
      x-enum-varnames: [HwAccelAuto, HwAccelNone, HwAccelVaapi, HwAccelQsv, HwAccelNvenc, HwAccelV4l2m2m, HwAccelVideotoolbox]
      description: >-
        Hardware acceleration (F006 R24). `auto` tries vaapi, qsv, nvenc, v4l2m2m, then videotoolbox (macOS, development
        only) and keeps the first that passes a test encode.
    HardwareStatus:
      type: object
      required: [configured, encoders, decoders, tonemap]
      description: The result of the last hardware test (F006 R24, R31).
      properties:
        configured:
          $ref: "#/components/schemas/HwAccelSetting"
        active:
          type: string
          description: The accelerator transcodes run on; absent in software.
          enum: [vaapi, qsv, nvenc, v4l2m2m, videotoolbox]
        device:
          type: string
          description: The render node in use (VAAPI, QSV).
          examples: ["/dev/dri/renderD128"]
        encoders:
          type: array
          description: Encoders that passed the test.
          items:
            type: string
          examples: [["h264_vaapi", "hevc_vaapi"]]
        decoders:
          type: array
          description: Codecs decoded on the GPU.
          items:
            type: string
          examples: [["h264", "hevc"]]
        tonemap:
          type: boolean
          description: The accelerator tone maps HDR on the GPU; otherwise it's done in software.
        disabledReason:
          type: string
          enum: [not_found, repeated_failures]
          description: >-
            Why hardware isn't in use although it's wanted: the test found nothing that works, or 3 transcodes failed on
            it within 10 minutes (until the next restart or settings change).
    PlaybackSettings:
      type: object
      required: [maxTranscodes, maxTranscodesDefault, remoteMaxBitrate, localNetworks, transcodeDirMaxBytes, transcodeDirMaxBytesDefault, encoderPreset, hwAccel, hardware]
      properties:
        maxTranscodes:
          type: integer
          description: Simultaneous video transcodes (R26).
        maxTranscodesDefault:
          type: integer
          description: The computed default, from the CPU count.
        remoteMaxBitrate:
          type: integer
          format: int64
          description: Bits per second for remote clients, 0 for no limit (R22).
        localNetworks:
          type: array
          description: Extra CIDRs counted as local, e.g. 100.64.0.0/10 for Tailscale.
          items:
            type: string
        transcodeDirMaxBytes:
          type: integer
          format: int64
          description: Size cap of the transcode folder (R27).
        transcodeDirMaxBytesDefault:
          type: integer
          format: int64
          description: The default computed at startup from the folder's free space.
        encoderPreset:
          $ref: "#/components/schemas/EncoderPreset"
        hwAccel:
          $ref: "#/components/schemas/HwAccelSetting"
        hwDevice:
          type: string
          description: The render node set by the admin; absent for the default (the first /dev/dri/renderD*).
        hardware:
          $ref: "#/components/schemas/HardwareStatus"
    PlaybackSettingsUpdate:
      type: object
      properties:
        maxTranscodes:
          type: [integer, "null"]
          minimum: 1
          maximum: 32
        remoteMaxBitrate:
          type: integer
          format: int64
          minimum: 0
        localNetworks:
          type: array
          items:
            type: string
        transcodeDirMaxBytes:
          type: [integer, "null"]
          format: int64
          minimum: 1
        encoderPreset:
          $ref: "#/components/schemas/EncoderPreset"
        hwAccel:
          $ref: "#/components/schemas/HwAccelSetting"
        hwDevice:
          type: [string, "null"]
          description: An absolute device path, e.g. /dev/dri/renderD129.
    ActivePlayback:
      type: object
      required: [session, userId, username, profileId, profileName, deviceName, itemTitle, positionMs, remote, startedAt, lastActivityAt]
      properties:
        session:
          $ref: "#/components/schemas/PlaybackSession"
        userId:
          type: string
        username:
          type: string
        profileId:
          type: string
        profileName:
          type: string
        deviceName:
          type: string
        itemTitle:
          type: string
        positionMs:
          type: integer
          format: int64
        state:
          $ref: "#/components/schemas/PlaybackState"
        remote:
          type: boolean
          description: The client is outside the local networks (R22).
        speed:
          type: number
          format: double
          description: >-
            Speed of the running FFmpeg against real time (1.0 = real time), absent when none runs. A transcode under 1.2
            can't keep up and is logged (`transcode_too_slow`). Hardware or software is `session.hardwareAcceleration`.
        startedAt:
          type: string
          format: date-time
        lastActivityAt:
          type: string
          format: date-time
    ActivePlaybackList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/ActivePlayback"
    ServerStats:
      type: object
      required: [uptimeSeconds, transcodes, maxTranscodes, uploadBps, drives]
      properties:
        uptimeSeconds:
          type: integer
          format: int64
          description: How long PLAID has been running.
        model:
          type: string
          description: The machine (a Raspberry Pi's board, a PC's product), when known.
        cpuPercent:
          type: number
          description: Processor load since the previous reading, 0–100.
        temperatureC:
          type: number
          description: The hottest thermal zone.
        transcodes:
          type: integer
          description: Conversions running now.
        maxTranscodes:
          type: integer
        uploadBps:
          type: integer
          format: int64
          description: What the streams are sent at right now, in bits per second (not measured).
        drives:
          type: array
          description: The drives holding library folders, one per device.
          items:
            $ref: "#/components/schemas/DriveStats"
    DriveStats:
      type: object
      required: [path, libraries, available]
      properties:
        path:
          type: string
          description: The first library folder on this drive.
        libraries:
          type: array
          items:
            type: string
          description: Names of the libraries with folders on it.
        available:
          type: boolean
          description: False when the folder can't be reached (a NAS not answering).
        totalBytes:
          type: integer
          format: int64
        freeBytes:
          type: integer
          format: int64
    Capabilities:
      type: object
      required: [ffprobe, ffmpeg, hwAccel, inotifyLimit, inotifyUsed, watchLimitReached]
      properties:
        hwAccel:
          $ref: "#/components/schemas/HardwareStatus"
        ffmpeg:
          type: object
          required: [found]
          properties:
            found:
              type: boolean
              description: When false, Direct Play still works and other methods answer `ffmpeg_missing` (F006 R31).
            version:
              type: string
              examples: ["7.1.1"]
        ffprobe:
          type: object
          required: [found]
          properties:
            found:
              type: boolean
              description: When false, files are listed with `probeStatus` `skipped` (`ffprobe_missing`).
            version:
              type: string
              examples: ["7.1.1"]
        inotifyLimit:
          type: integer
          description: Per-user watch limit, 0 when unknown or not Linux.
        inotifyUsed:
          type: integer
        watchLimitReached:
          type: array
          description: Folders scanned periodically because the watch limit was reached.
          items:
            type: string
    ProblemCode:
      type: string
      enum: [hw_fallback, ffmpeg_restarted, folder_unavailable, folder_unreadable, watch_limit, provider_key_refused]
      x-enum-varnames:
        - ProblemHWFallback
        - ProblemFFmpegRestarted
        - ProblemFolderUnavailable
        - ProblemFolderUnreadable
        - ProblemWatchLimit
        - ProblemProviderKeyRefused
    Problem:
      type: object
      required: [id, code, params, firstSeen, lastSeen, count]
      properties:
        id:
          type: string
        code:
          $ref: "#/components/schemas/ProblemCode"
        params:
          type: object
          description: >-
            What the problem is about, by code: `path` (folders, watch limit), `accel` (hw_fallback), `title`
            (ffmpeg_restarted), `provider` (provider_key_refused). Never tokens or keys.
          additionalProperties:
            type: string
        firstSeen:
          type: string
          format: date-time
        lastSeen:
          type: string
          format: date-time
        count:
          type: integer
          description: How many times it happened since it was first seen.
        resolvedAt:
          type: string
          format: date-time
    ProblemList:
      type: object
      required: [problems]
      properties:
        problems:
          type: array
          items:
            $ref: "#/components/schemas/Problem"
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable key. Clients translate it through i18n.
              examples: ["not_found"]
            message:
              type: string
              description: Human-readable English message, for logs and developers. Never shown to end users.
            details:
              type: array
              description: Invalid fields, set with code `validation_failed`.
              items:
                type: object
                required: [field, code]
                properties:
                  field:
                    type: string
                    examples: ["username"]
                  code:
                    type: string
                    description: Stable key for this field's problem. Clients translate it through i18n.
                    examples: ["too_short"]
