openapi: 3.1.0
info:
  title: PLAID API
  version: 0.1.0
  description: |
    API of the PLAID media server. This file is the source of truth:
    the Go server interfaces and every client are generated from it.
servers:
  - url: /api/v1
# Every operation needs a session unless it declares `security: []` (F003-R12).
# Native apps send a bearer token, the web app the plaid_session cookie.
security:
  - bearerAuth: []
  - cookieAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness and build info
      tags: [system]
      security: []
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Server is up but a dependency is failing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /server:
    get:
      operationId: getServerInfo
      summary: Identify a PLAID server
      tags: [system]
      security: []
      responses:
        "200":
          description: Server identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerInfo"
        default:
          $ref: "#/components/responses/Error"
  /setup:
    get:
      operationId: getSetup
      summary: First-run setup state
      tags: [setup]
      security: []
      responses:
        "200":
          description: Setup state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupState"
        default:
          $ref: "#/components/responses/Error"
  /setup/admin:
    post:
      operationId: createFirstAdmin
      summary: Create the first admin account and sign in
      description: |
        Only while no account exists (`409 setup_complete` after). Accepted from
        a private or loopback address, or with the setup code from the server log
        (`403 setup_code_required`). Web clients (`X-Plaid-Client: web`) get the
        session as a cookie, others get the token in the body.
      tags: [setup]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupAdminRequest"
      responses:
        "201":
          description: Admin created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        default:
          $ref: "#/components/responses/Error"
  /auth/login:
    post:
      operationId: login
      summary: Sign in with username and password
      description: |
        Errors never say whether the username exists (`401 invalid_credentials`).
        Repeated failures return `429 too_many_attempts` with `Retry-After`.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        default:
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      operationId: logout
      summary: End the current session
      tags: [auth]
      responses:
        "204":
          description: Signed out
        default:
          $ref: "#/components/responses/Error"
  /me:
    get:
      operationId: getMe
      summary: The signed-in account, its profiles and the active one
      tags: [me]
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateMe
      summary: Update own display name or locale
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Error"
  /me/password:
    post:
      operationId: changeMyPassword
      summary: Change own password
      description: Ends every other session of the account. The current one keeps working.
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed
        default:
          $ref: "#/components/responses/Error"
  /me/profiles:
    get:
      operationId: listMyProfiles
      summary: Profiles of the account
      tags: [profiles]
      responses:
        "200":
          description: Profiles, default first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Profile"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createMyProfile
      summary: Add a profile (8 at most)
      tags: [profiles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProfileRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        default:
          $ref: "#/components/responses/Error"
  /me/profiles/{profileId}:
    parameters:
      - $ref: "#/components/parameters/ProfileId"
    patch:
      operationId: updateMyProfile
      summary: Update a profile
      description: |
        Changing `pin`, `maxAge` or `allowUnrated` needs `currentPin` (when the
        profile has a PIN) or the account `password`.
      tags: [profiles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteMyProfile
      summary: Delete a profile (not the last one)
      tags: [profiles]
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"
  /session/profile:
    post:
      operationId: selectProfile
      summary: Set the active profile of the current session
      description: A PIN-protected profile needs its PIN every time. 5 wrong PINs lock it for 5 minutes on this session.
      tags: [profiles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectProfileRequest"
      responses:
        "200":
          description: Profile selected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Error"
  /me/sessions:
    get:
      operationId: listMySessions
      summary: Signed-in devices of the account
      tags: [sessions]
      responses:
        "200":
          description: Sessions, most recently seen first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionListItem"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: revokeMyOtherSessions
      summary: Sign out every other device
      tags: [sessions]
      responses:
        "204":
          description: Other sessions ended
        default:
          $ref: "#/components/responses/Error"
  /me/sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    delete:
      operationId: revokeMySession
      summary: Sign out one device
      tags: [sessions]
      responses:
        "204":
          description: Session ended
        default:
          $ref: "#/components/responses/Error"
  /users:
    get:
      operationId: listUsers
      summary: All accounts (admin)
      tags: [users]
      responses:
        "200":
          description: Accounts, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createUser
      summary: Create an account with a temporary password (admin)
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        default:
          $ref: "#/components/responses/Error"
  /users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    patch:
      operationId: updateUser
      summary: Update an account (admin)
      description: Demoting, disabling or deleting the last active admin returns `409 last_admin`. Disabling ends every session of the account.
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteUser
      summary: Delete an account, its profiles and sessions (admin)
      tags: [users]
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"
  /users/{userId}/password:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      operationId: resetUserPassword
      summary: Set a temporary password (admin)
      description: Ends every session of the account; the user must choose a new password at next sign-in.
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password reset
        default:
          $ref: "#/components/responses/Error"
  /users/{userId}/sessions:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      operationId: listUserSessions
      summary: Signed-in devices of an account (admin)
      tags: [users]
      responses:
        "200":
          description: Sessions, most recently seen first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionListItem"
        default:
          $ref: "#/components/responses/Error"
  /users/{userId}/sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
      - $ref: "#/components/parameters/SessionId"
    delete:
      operationId: revokeUserSession
      summary: Sign out one device of an account (admin)
      tags: [users]
      responses:
        "204":
          description: Session ended
        default:
          $ref: "#/components/responses/Error"
  /pairing:
    post:
      operationId: startPairing
      summary: Get a code to pair a TV
      description: The TV shows `code` and polls `GET /pairing/{id}` with `pollSecret`. Expires after 10 minutes.
      tags: [pairing]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartPairingRequest"
      responses:
        "201":
          description: Pairing started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingStarted"
        default:
          $ref: "#/components/responses/Error"
  /pairing/{pairingId}:
    parameters:
      - name: pairingId
        in: path
        required: true
        schema:
          type: string
      - name: X-Pairing-Secret
        in: header
        required: true
        description: The `pollSecret` returned when the pairing started.
        schema:
          type: string
    get:
      operationId: pollPairing
      summary: Poll a pairing until it is claimed
      description: |
        Not authenticated by a session but by the poll secret. `202` while
        waiting; `200` with the session token exactly once after the claim;
        `404 pairing_not_found` after that or for a wrong secret.
      tags: [pairing]
      security: []
      responses:
        "200":
          description: Claimed; the TV is signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "202":
          description: Not claimed yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingPending"
        default:
          $ref: "#/components/responses/Error"
  /pairing/claim:
    post:
      operationId: claimPairing
      summary: Sign a TV in with the code it shows
      tags: [pairing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimPairingRequest"
      responses:
        "200":
          description: Claimed; the TV gets its session on its next poll
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        default:
          $ref: "#/components/responses/Error"
  /libraries:
    get:
      operationId: listLibraries
      summary: All libraries, with folder status, counts and scan state
      tags: [libraries]
      responses:
        "200":
          description: Libraries, by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Library"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createLibrary
      summary: Create a library and start its first scan (admin)
      description: |
        Each folder must be an absolute path to a directory PLAID can read and traverse
        (`422 folder_not_found`, `422 folder_unreadable`), and can't be inside or contain
        another library's folder (`409 folder_overlap`). Nothing is created on error.
      tags: [libraries]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLibraryRequest"
      responses:
        "201":
          description: Created; a full scan is queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Library"
        default:
          $ref: "#/components/responses/Error"
  /libraries/{libraryId}:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    get:
      operationId: getLibrary
      summary: One library
      tags: [libraries]
      responses:
        "200":
          description: The library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Library"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateLibrary
      summary: Rename a library, change its folders or scan interval (admin)
      description: |
        Absent fields are unchanged. `folders` replaces the whole list; added folders are
        validated like on creation and scanned. A `type` different from the current one
        returns `422 library_type_immutable`. `scanIntervalSeconds: null` goes back to the
        defaults (15 min unwatched, 6 h watched).
      tags: [libraries]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLibraryRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Library"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteLibrary
      summary: Delete a library's rows; files on disk are never touched (admin)
      tags: [libraries]
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"
  /libraries/{libraryId}/scan:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    get:
      operationId: getLibraryScan
      summary: Current scan progress (admin)
      tags: [libraries]
      responses:
        "200":
          description: Progress snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanProgress"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: scanLibrary
      summary: Scan now, or full rescan (admin)
      description: A request during a running scan queues one more scan; further requests are merged into it.
      tags: [libraries]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanRequest"
      responses:
        "202":
          description: Scan started or queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanProgress"
        default:
          $ref: "#/components/responses/Error"
  /libraries/{libraryId}/scan/events:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    get:
      operationId: getLibraryScanEvents
      summary: Live scan progress as server-sent events (admin)
      description: |
        `text/event-stream`. Events `progress`, `completed` and `failed`, each with a
        `ScanEvent` JSON in `data`. A progress event comes at least every 2 s while a scan
        runs, and a `: ping` comment every 15 s. The current state is sent first.
      tags: [libraries]
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /libraries/{libraryId}/items:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    get:
      operationId: listLibraryItems
      summary: Items of a library, by kind and parent
      description: Ordered by sort title. Hidden items (no file left on disk) are left out.
      tags: [libraries]
      parameters:
        - name: kind
          in: query
          description: Defaults to the top level, `movie` or `show`, when `parentId` is absent.
          schema:
            $ref: "#/components/schemas/ItemKind"
        - name: parentId
          in: query
          description: Seasons of a show, or episodes of a season.
          schema:
            type: string
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPage"
        default:
          $ref: "#/components/responses/Error"
  /libraries/{libraryId}/unrecognized:
    parameters:
      - $ref: "#/components/parameters/LibraryId"
    get:
      operationId: listUnrecognizedFiles
      summary: Files whose name couldn't be understood (admin)
      tags: [libraries]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of files present on disk, by path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnrecognizedPage"
        default:
          $ref: "#/components/responses/Error"
  /items/{itemId}:
    parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getItem
      summary: An item with its files and streams
      tags: [libraries]
      responses:
        "200":
          description: The item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemDetail"
        default:
          $ref: "#/components/responses/Error"
  /fs/browse:
    get:
      operationId: browseFolders
      summary: Sub-folders of a server folder, for the folder picker (admin)
      description: |
        Lists directory names only, never files. `path` must be absolute without `..`;
        it defaults to `/`, or to the list of roots when `PLAID_BROWSE_ROOTS` is set,
        in which case paths outside the roots return `404 not_found`.
      tags: [libraries]
      parameters:
        - name: path
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Sub-folders, by name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowseResult"
        default:
          $ref: "#/components/responses/Error"
  /server/capabilities:
    get:
      operationId: getServerCapabilities
      summary: ffprobe and file watching status (admin)
      tags: [libraries]
      responses:
        "200":
          description: Capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
        default:
          $ref: "#/components/responses/Error"
components:
  parameters:
    LibraryId:
      name: libraryId
      in: path
      required: true
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      description: Opaque `nextCursor` of the previous page.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    ProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: string
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Error. `error.code` is a stable key clients translate.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque session token returned by sign-in, setup or TV pairing.
    cookieAuth:
      type: apiKey
      in: cookie
      name: plaid_session
      description: "HttpOnly session cookie used by the web app. State-changing requests also need `X-Plaid-Client: web` and a same-origin `Origin`."
  schemas:
    Health:
      type: object
      required: [status, version, commit, uptimeSeconds, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
          examples: ["0.1.0-dev"]
        commit:
          type: string
          examples: ["02ec07a"]
        uptimeSeconds:
          type: integer
          format: int64
          minimum: 0
        database:
          type: string
          enum: [ok, error]
    ServerInfo:
      type: object
      required: [name, version, setupComplete]
      properties:
        name:
          type: string
          examples: ["living-room-nas"]
        version:
          type: string
        setupComplete:
          type: boolean
    SetupState:
      type: object
      required: [setupComplete, requiresSetupCode]
      properties:
        setupComplete:
          type: boolean
        requiresSetupCode:
          type: boolean
          description: True when this client isn't on a private network and must give the setup code from the server log.
    Role:
      type: string
      enum: [admin, member]
    DeviceType:
      type: string
      enum: [web, ios, ipados, tvos, android, androidtv, other]
    Device:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          examples: ["Firefox on macOS"]
        type:
          $ref: "#/components/schemas/DeviceType"
        clientVersion:
          type: string
          maxLength: 32
    SetupAdminRequest:
      type: object
      required: [displayName, username, password]
      properties:
        displayName:
          type: string
        username:
          type: string
        password:
          type: string
        locale:
          type: string
          examples: ["fr"]
        setupCode:
          type: string
        device:
          $ref: "#/components/schemas/Device"
    LoginRequest:
      type: object
      required: [username, password, device]
      properties:
        username:
          type: string
        password:
          type: string
        device:
          $ref: "#/components/schemas/Device"
    SessionInfo:
      type: object
      required: [id, deviceName, deviceType]
      properties:
        id:
          type: string
        deviceName:
          type: string
        deviceType:
          $ref: "#/components/schemas/DeviceType"
    AuthResult:
      type: object
      required: [expiresAt, session, user, profiles]
      properties:
        token:
          type: string
          description: "Session token for `Authorization: Bearer`. Absent for web clients, which get the `plaid_session` cookie instead."
        expiresAt:
          type: string
          format: date-time
        session:
          $ref: "#/components/schemas/SessionInfo"
        user:
          $ref: "#/components/schemas/User"
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/Profile"
        activeProfile:
          $ref: "#/components/schemas/Profile"
    User:
      type: object
      required: [id, username, displayName, role, locale, mustChangePassword]
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        locale:
          type: string
        mustChangePassword:
          type: boolean
    AdminUser:
      type: object
      required: [id, username, displayName, role, locale, mustChangePassword, disabled, createdAt]
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        locale:
          type: string
        mustChangePassword:
          type: boolean
        disabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
    Profile:
      type: object
      required: [id, name, avatarColor, hasPin, maxAge, allowUnrated, locale, isDefault]
      properties:
        id:
          type: string
        name:
          type: string
        avatarColor:
          type: integer
          minimum: 0
          maximum: 7
          description: Index of the `party-*` design token.
        hasPin:
          type: boolean
        maxAge:
          type: [integer, "null"]
          description: Age limit, one of 0, 7, 10, 12, 13, 16 or 18; null means no limit. Enforced by the browsing and playback features.
        allowUnrated:
          type: boolean
        locale:
          type: [string, "null"]
          description: Overrides the account locale; null uses the account's.
        isDefault:
          type: boolean
    Me:
      type: object
      required: [user, profiles]
      properties:
        user:
          $ref: "#/components/schemas/User"
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/Profile"
        activeProfile:
          $ref: "#/components/schemas/Profile"
    UpdateMeRequest:
      type: object
      properties:
        displayName:
          type: string
        locale:
          type: string
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
    CreateProfileRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        avatarColor:
          type: integer
        pin:
          type: string
          description: 4 digits.
        maxAge:
          type: integer
        allowUnrated:
          type: boolean
          description: Defaults to false when `maxAge` is set, true otherwise.
        locale:
          type: string
    UpdateProfileRequest:
      type: object
      description: Absent fields are unchanged; `null` clears `pin`, `maxAge` or `locale`.
      properties:
        name:
          type: string
        avatarColor:
          type: integer
        pin:
          type: [string, "null"]
        maxAge:
          type: [integer, "null"]
        allowUnrated:
          type: boolean
        locale:
          type: [string, "null"]
        isDefault:
          type: boolean
          description: Only `true` is meaningful; it moves the default flag to this profile.
        currentPin:
          type: string
          description: Proof for sensitive changes, when the profile has a PIN.
        password:
          type: string
          description: Account password, the other proof for sensitive changes.
    SelectProfileRequest:
      type: object
      required: [profileId]
      properties:
        profileId:
          type: string
        pin:
          type: string
    SessionListItem:
      type: object
      required: [id, deviceName, deviceType, createdAt, lastSeenAt, current]
      properties:
        id:
          type: string
        deviceName:
          type: string
        deviceType:
          $ref: "#/components/schemas/DeviceType"
        clientVersion:
          type: string
        lastIp:
          type: string
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        current:
          type: boolean
          description: True for the session making the request.
    CreateUserRequest:
      type: object
      required: [displayName, username, temporaryPassword, role]
      properties:
        displayName:
          type: string
        username:
          type: string
        temporaryPassword:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        locale:
          type: string
    UpdateUserRequest:
      type: object
      properties:
        displayName:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        locale:
          type: string
        disabled:
          type: boolean
    ResetPasswordRequest:
      type: object
      required: [temporaryPassword]
      properties:
        temporaryPassword:
          type: string
    StartPairingRequest:
      type: object
      required: [device]
      properties:
        device:
          $ref: "#/components/schemas/Device"
    PairingStarted:
      type: object
      required: [id, code, pollSecret, expiresAt]
      properties:
        id:
          type: string
        code:
          type: string
          description: Shown on the TV as `XXX-XXX`.
          examples: ["K7P-4QX"]
        pollSecret:
          type: string
        expiresAt:
          type: string
          format: date-time
    PairingPending:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending]
    ClaimPairingRequest:
      type: object
      required: [code, profileId]
      properties:
        code:
          type: string
          description: Case-insensitive, with or without the dash.
        profileId:
          type: string
          description: Profile the TV starts on.
        pin:
          type: string
          description: Needed when that profile has a PIN.
    LibraryType:
      type: string
      enum: [movies, shows]
    LibraryFolder:
      type: object
      required: [id, path, watched, status]
      properties:
        id:
          type: string
        path:
          type: string
          description: Cleaned, with symlinks resolved.
          examples: ["/srv/media/movies"]
        fsType:
          type: string
          examples: ["ext4", "nfs"]
        watched:
          type: boolean
          description: Changes are picked up live; false on network file systems or when the watch limit was reached.
        status:
          type: string
          enum: [ok, unavailable, unreadable]
    LibraryCounts:
      type: object
      required: [movies, shows, episodes, files, unrecognized]
      properties:
        movies:
          type: integer
        shows:
          type: integer
        episodes:
          type: integer
        files:
          type: integer
          description: Files present on disk.
        unrecognized:
          type: integer
    Library:
      type: object
      required: [id, name, type, scanIntervalSeconds, folders, counts, scan]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          $ref: "#/components/schemas/LibraryType"
        scanIntervalSeconds:
          type: [integer, "null"]
          description: Null when the defaults apply (15 min unwatched, 6 h watched).
        lastScanAt:
          type: string
          format: date-time
        folders:
          type: array
          items:
            $ref: "#/components/schemas/LibraryFolder"
        counts:
          $ref: "#/components/schemas/LibraryCounts"
        scan:
          $ref: "#/components/schemas/ScanProgress"
    CreateLibraryRequest:
      type: object
      required: [name, type, folders]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        type:
          $ref: "#/components/schemas/LibraryType"
        folders:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: string
          examples: [["/srv/media/movies"]]
        scanIntervalSeconds:
          type: integer
          minimum: 300
          maximum: 86400
    UpdateLibraryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        type:
          $ref: "#/components/schemas/LibraryType"
        folders:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: string
        scanIntervalSeconds:
          type: [integer, "null"]
          minimum: 300
          maximum: 86400
    ScanRequest:
      type: object
      properties:
        full:
          type: boolean
          default: false
          description: Re-probe every file, changed or not.
    ScanState:
      type: string
      enum: [idle, queued, scanning, analyzing]
    ScanCounters:
      type: object
      required: [found, new, changed, moved, missing, analyzed, failed, unrecognized]
      properties:
        found:
          type: integer
        new:
          type: integer
        changed:
          type: integer
        moved:
          type: integer
        missing:
          type: integer
        analyzed:
          type: integer
        failed:
          type: integer
        unrecognized:
          type: integer
    ScanProgress:
      type: object
      required: [state, queued, full, counters]
      properties:
        state:
          $ref: "#/components/schemas/ScanState"
        queued:
          type: boolean
          description: Another scan starts when this one ends.
        full:
          type: boolean
        currentFolder:
          type: string
        startedAt:
          type: string
          format: date-time
        counters:
          $ref: "#/components/schemas/ScanCounters"
          description: Of the running scan, or of the last one when idle.
    ScanEvent:
      type: object
      description: The `data` of a scan server-sent event.
      required: [type, progress]
      properties:
        type:
          type: string
          enum: [progress, completed, failed]
        progress:
          $ref: "#/components/schemas/ScanProgress"
        error:
          type: string
          description: Set on `failed`, English, for logs.
    ItemKind:
      type: string
      enum: [movie, show, season, episode]
    ItemHints:
      type: object
      description: Ids found in file names, for metadata matching (F005).
      properties:
        tmdb:
          type: string
        imdb:
          type: string
    Resolution:
      type: object
      required: [width, height]
      properties:
        width:
          type: integer
        height:
          type: integer
    TechnicalSummary:
      type: object
      description: Across the item's files present on disk (for shows and seasons, their episodes).
      required: [hdrFormats, audioLanguages]
      properties:
        resolution:
          $ref: "#/components/schemas/Resolution"
          description: The largest one.
        hdrFormats:
          type: array
          items:
            type: string
            enum: [hdr10, hdr10plus, dolby_vision, hlg]
        audioLanguages:
          type: array
          description: ISO 639-2/B codes; clients show names with `Intl.DisplayNames`.
          items:
            type: string
          examples: [["eng", "fre"]]
    ItemSummary:
      type: object
      required: [id, kind, fileCount, childCount, technical]
      properties:
        id:
          type: string
        kind:
          $ref: "#/components/schemas/ItemKind"
        parentId:
          type: string
        title:
          type: string
          description: Parsed from names; matched metadata comes with F005.
        year:
          type: integer
        seasonNumber:
          type: integer
        episodeNumber:
          type: integer
        airDate:
          type: string
          format: date
        hints:
          $ref: "#/components/schemas/ItemHints"
        fileCount:
          type: integer
        childCount:
          type: integer
          description: Seasons of a show, episodes of a season; 0 otherwise.
        technical:
          $ref: "#/components/schemas/TechnicalSummary"
    ItemPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemSummary"
        nextCursor:
          type: string
          description: Absent on the last page.
    MediaStream:
      type: object
      required: [index, type, language, default, forced, sdh, imageBased, external]
      properties:
        index:
          type: integer
          description: ffprobe stream index; external subtitles use 1000 and up.
        type:
          type: string
          enum: [video, audio, subtitle]
        codec:
          type: string
        language:
          type: string
          description: ISO 639-2/B, `und` when unknown.
        title:
          type: string
        channels:
          type: integer
        default:
          type: boolean
        forced:
          type: boolean
        sdh:
          type: boolean
        imageBased:
          type: boolean
          description: Bitmap subtitles (PGS, VobSub).
        external:
          type: boolean
    DolbyVision:
      type: object
      required: [profile, compatibility]
      properties:
        profile:
          type: integer
          examples: [8]
        compatibility:
          type: integer
          examples: [1]
    MediaFile:
      type: object
      required: [id, path, size, modifiedAt, parseStatus, probeStatus, streams]
      properties:
        id:
          type: string
        path:
          type: string
        size:
          type: integer
          format: int64
        modifiedAt:
          type: string
          format: date-time
        edition:
          type: string
          examples: ["Director's Cut"]
        parseStatus:
          type: string
          enum: [ok, unrecognized]
        probeStatus:
          type: string
          enum: [pending, ok, failed, skipped]
        container:
          type: string
        durationMs:
          type: integer
          format: int64
        bitrate:
          type: integer
          format: int64
        width:
          type: integer
        height:
          type: integer
        videoCodec:
          type: string
        hdrFormat:
          type: string
          enum: [hdr10, hdr10plus, dolby_vision, hlg]
        dolbyVision:
          $ref: "#/components/schemas/DolbyVision"
        missingSince:
          type: string
          format: date-time
        streams:
          type: array
          items:
            $ref: "#/components/schemas/MediaStream"
    ItemDetail:
      allOf:
        - $ref: "#/components/schemas/ItemSummary"
        - type: object
          required: [files]
          properties:
            files:
              type: array
              items:
                $ref: "#/components/schemas/MediaFile"
    UnrecognizedFile:
      type: object
      required: [id, path, size, probeStatus]
      properties:
        id:
          type: string
        path:
          type: string
        size:
          type: integer
          format: int64
        probeStatus:
          type: string
          enum: [pending, ok, failed, skipped]
    UnrecognizedPage:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/UnrecognizedFile"
        nextCursor:
          type: string
    BrowseEntry:
      type: object
      required: [name, path, readable]
      properties:
        name:
          type: string
        path:
          type: string
        readable:
          type: boolean
          description: PLAID can list and enter this folder.
    BrowseResult:
      type: object
      required: [path, parent, entries]
      properties:
        path:
          type: string
          description: Empty when listing the configured roots.
        parent:
          type: [string, "null"]
          description: Null at `/`, at a configured root, or when listing the roots.
        entries:
          type: array
          items:
            $ref: "#/components/schemas/BrowseEntry"
    Capabilities:
      type: object
      required: [ffprobe, inotifyLimit, inotifyUsed, watchLimitReached]
      properties:
        ffprobe:
          type: object
          required: [found]
          properties:
            found:
              type: boolean
              description: When false, files are listed with `probeStatus` `skipped` (`ffprobe_missing`).
            version:
              type: string
              examples: ["7.1.1"]
        inotifyLimit:
          type: integer
          description: Per-user watch limit, 0 when unknown or not Linux.
        inotifyUsed:
          type: integer
        watchLimitReached:
          type: array
          description: Folders scanned periodically because the watch limit was reached.
          items:
            type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable key. Clients translate it through i18n.
              examples: ["not_found"]
            message:
              type: string
              description: Human-readable English message, for logs and developers. Never shown to end users.
            details:
              type: array
              description: Invalid fields, set with code `validation_failed`.
              items:
                type: object
                required: [field, code]
                properties:
                  field:
                    type: string
                    examples: ["username"]
                  code:
                    type: string
                    description: Stable key for this field's problem. Clients translate it through i18n.
                    examples: ["too_short"]
