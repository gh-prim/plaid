        durationMs:
          type: integer
          format: int64
        bitrate:
          type: integer
          format: int64
        width:
          type: integer
        height:
          type: integer
        videoCodec:
          type: string
        hdrFormat:
          type: string
          enum: [hdr10, hdr10plus, dolby_vision, hlg]
        dolbyVision:
          $ref: "#/components/schemas/DolbyVision"
        missingSince:
          type: string
          format: date-time
        streams:
          type: array
          items:
            $ref: "#/components/schemas/MediaStream"
    ItemDetail:
      allOf:
        - $ref: "#/components/schemas/ItemSummary"
        - type: object
          required: [files]
          properties:
            files:
              type: array
              items:
                $ref: "#/components/schemas/MediaFile"
            metadata:
              $ref: "#/components/schemas/ItemMetadata"
    MetadataCounts:
      type: object
