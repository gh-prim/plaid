        language:
          type: string
          description: ISO 639-2/B, `und` when unknown.
        title:
          type: string
        channels:
          type: integer
        default:
          type: boolean
        forced:
          type: boolean
        sdh:
          type: boolean
        imageBased:
          type: boolean
          description: Bitmap subtitles (PGS, VobSub).
        external:
          type: boolean
    DolbyVision:
      type: object
      required: [profile, compatibility]
      properties:
        profile:
          type: integer
          examples: [8]
        compatibility:
          type: integer
          examples: [1]
    MediaFile:
      type: object
      required: [id, path, size, modifiedAt, parseStatus, probeStatus, streams]
      properties:
        id:
          type: string
        path:
          type: string
        size:
          type: integer
          format: int64
        modifiedAt:
          type: string
          format: date-time
        edition:
          type: string
