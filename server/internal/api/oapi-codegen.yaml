package: api
generate:
  std-http-server: true
  strict-server: true
  models: true
output-options:
  nullable-type: true
  # Keep schemas no operation references, such as ScanEvent (the data of
  # server-sent events).
  skip-prune: true
  # /stream/{token}/... is served by a plain handler (Range, HEAD, long
  # polling for segments, F006): the operations stay in the contract for
  # clients, the generated server skips them. So does the hero preview
  # (Range for <video>).
  exclude-tags: [stream, preview]
output: api.gen.go
