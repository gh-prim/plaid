version: "2"
run:
  timeout: 5m
linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert
    - unparam
  settings:
    errcheck:
      exclude-functions:
        - (*database/sql.DB).Close
        - (*database/sql.Tx).Rollback
        - (*database/sql.Rows).Close
    gosec:
      excludes:
        - G104 # unhandled errors: covered by errcheck with our exclusions
  exclusions:
    generated: strict
    rules:
      - path: _test\.go
        linters: [gosec, noctx, bodyclose, errcheck]
formatters:
  enable:
    - gofmt
    - goimports
