# getplaid.direct on Coolify ("Docker Compose" build pack, base directory
# /services/direct). Coolify's Traefik terminates TLS for the HTTP API and
# short links; DNS is published straight on the host's port 53.
services:
  direct:
    build: .
    restart: unless-stopped
    environment:
      # Coolify: generates the Traefik route to container port 8080. Set the
      # domain to https://getplaid.direct in the service's "Domains" field.
      - SERVICE_FQDN_DIRECT_8080
      - DIRECT_ZONE=${DIRECT_ZONE:-getplaid.direct}
      # The host's public IPv4 (the glue record's address). Required.
      - DIRECT_PUBLIC_IP=${DIRECT_PUBLIC_IP:?set DIRECT_PUBLIC_IP to the host's public IPv4}
      - DIRECT_PUBLIC_IPV6=${DIRECT_PUBLIC_IPV6:-}
      - DIRECT_ADMIN_EMAIL=${DIRECT_ADMIN_EMAIL:-hostmaster@getplaid.tv}
      - DIRECT_SITE_URL=${DIRECT_SITE_URL:-https://getplaid.tv}
      - DIRECT_TRUSTED_PROXIES=${DIRECT_TRUSTED_PROXIES:-}
    # DIRECT_DNS_BIND: the host address DNS listens on. Set it to the public
    # IP when systemd-resolved holds 127.0.0.53:53, so the two don't clash.
    ports:
      - "${DIRECT_DNS_BIND:-0.0.0.0}:53:5353/udp"
      - "${DIRECT_DNS_BIND:-0.0.0.0}:53:5353/tcp"
    # Coolify routes to the first container port under "ports" (5353, the
    # DNS one), whatever the domain says: this router, ahead of Coolify's,
    # sends the API and short links to the HTTP port.
    labels:
      - traefik.http.routers.getplaid-direct.rule=Host(`getplaid.direct`)
      - traefik.http.routers.getplaid-direct.entrypoints=https
      - traefik.http.routers.getplaid-direct.tls=true
      - traefik.http.routers.getplaid-direct.tls.certresolver=letsencrypt
      - traefik.http.routers.getplaid-direct.priority=1000
      - traefik.http.routers.getplaid-direct.service=getplaid-direct
      - traefik.http.services.getplaid-direct.loadbalancer.server.port=8080
    volumes:
      - direct-data:/data
    healthcheck:
      test: ["CMD", "/direct", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  direct-data:
