<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>PLAID</title>
  <defs>
    <pattern id="sett" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="#1d2a3a"/>
      <rect x="0" y="0" width="60" height="120" fill="#1f3a30" opacity=".85"/>
      <rect x="0" y="0" width="120" height="60" fill="#1f3a30" opacity=".55"/>
      <rect x="22" y="0" width="16" height="120" fill="#0d1218" opacity=".7"/>
      <rect x="0" y="22" width="120" height="16" fill="#0d1218" opacity=".6"/>
      <rect x="88" y="0" width="6" height="120" fill="#0d1218" opacity=".55"/>
      <rect x="0" y="88" width="120" height="6" fill="#0d1218" opacity=".5"/>
      <rect x="58" y="0" width="4" height="120" fill="#f4ecdc"/>
      <rect x="0" y="58" width="120" height="4" fill="#f4ecdc" opacity=".9"/>
      <rect x="104" y="0" width="2" height="120" fill="#f4ecdc" opacity=".35"/>
      <rect x="0" y="104" width="120" height="2" fill="#f4ecdc" opacity=".3"/>
    </pattern>
    <pattern id="twill" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="4" height="8" fill="#000" opacity=".16"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="42%" r="50%">
      <stop offset="0" stop-color="#f4ecdc" stop-opacity=".28"/>
      <stop offset="1" stop-color="#f4ecdc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2620"/>
      <stop offset="1" stop-color="#110f0c"/>
    </linearGradient>
    <linearGradient id="spec" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".12" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".35"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect width="1024" height="1024" rx="228"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="bright">
      <feComponentTransfer>
        <feFuncR type="linear" slope="1.75"/>
        <feFuncG type="linear" slope="1.75"/>
        <feFuncB type="linear" slope="1.75"/>
      </feComponentTransfer>
    </filter>
    <path id="play" d="M372 262 L372 762 Q372 806 410 784 L790 548 Q826 524 790 500 L410 240 Q372 218 372 262 Z"/>
  </defs>
  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#glow)"/>
    <use href="#play" fill="#000" opacity=".4" transform="translate(0 22)" filter="url(#shadow)"/>
    <use href="#play" fill="url(#sett)" filter="url(#bright)"/>
    <use href="#play" fill="url(#twill)"/>
    <use href="#play" fill="url(#fold)" opacity=".7"/>
    <use href="#play" fill="none" stroke="#f4ecdc" stroke-opacity=".55" stroke-width="10"/>
    <rect width="1024" height="1024" fill="url(#spec)"/>
  </g>
  <rect x="1.5" y="1.5" width="1021" height="1021" rx="227" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="3"/>
</svg>
