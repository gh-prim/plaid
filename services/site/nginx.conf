# getplaid.tv: static files from dist/, gzip, long cache for fingerprinted assets.
# TLS and the public ports are handled by the reverse proxy in front (Coolify/Traefik).

# www.getplaid.tv -> getplaid.tv (kept here too in case the proxy forwards www).
server {
    listen 80;
    server_name www.getplaid.tv;
    return 301 https://getplaid.tv$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript application/xml image/svg+xml text/plain;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cache-Control "no-cache" always;

    # Fingerprinted CSS and JS: the name changes with the content.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~* \.(?:woff2|png|svg)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /fr/ {
        error_page 404 /fr/404.html;
        try_files $uri $uri/ =404;
    }

    location / {
        error_page 404 /404.html;
        try_files $uri $uri/ =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
